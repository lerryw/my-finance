<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Finance</title>

<style>
:root {
  --bg: #FAF9F6;
  --card: #FFFFFF;
  --text: #292B2F;
  --sub: #74777C;

  --orange: #E98B5C;
  --yellow: #F4C95D;
  --blue: #8FAFC0;
  --rose: #E98278;
  --green: #83B7A6;

  --border: #EEECE7;
  --shadow: 0 8px 28px rgba(41,43,47,.055);

  --radius: 22px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    "Noto Sans SC",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
}

/* =========================
   Sidebar
========================= */

.sidebar {
  width: 292px;
  min-height: 100vh;
  background: rgba(255,255,255,.55);
  border-right: 1px solid var(--border);
  padding: 28px 24px;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: 600;
  margin-bottom: 34px;
}

.brand-icon {
  font-size: 27px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav button {
  border: none;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 14px 16px;
  border-radius: 15px;
  font-size: 16px;
  transition: .2s;
}

.nav button:hover {
  background: #F7F3EC;
}

.nav button.active {
  background: #FFF6E9;
  color: #5F5347;
  font-weight: 600;
}

.nav-icon {
  width: 25px;
  display: inline-block;
  font-size: 18px;
}

.quick-title {
  margin-top: 38px;
  margin-bottom: 14px;
  color: var(--sub);
  font-size: 13px;
}

.quick-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quick-btn {
  border: none;
  border-radius: 17px;
  padding: 14px 16px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
}

.quick-btn.voice {
  background: #FFF0E8;
  color: #D9774A;
}

.quick-btn.photo {
  background: #FFF7DE;
  color: #75622D;
}

.quick-btn.manual {
  background: #EDF6FA;
  color: #547B8D;
}

.quick-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.65);
  font-size: 19px;
}

/* =========================
   Main
========================= */

.main {
  margin-left: 292px;
  width: calc(100% - 292px);
  padding: 30px;
}

.topbar {
  height: 46px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 16px;
  margin-bottom: 10px;
}

.search-box {
  width: 300px;
  height: 40px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 22px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: var(--sub);
  font-size: 13px;
}

.search-box span {
  margin-right: 9px;
  font-size: 17px;
}

.page-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.page-title h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -.5px;
}

.year-select {
  border: none;
  background: transparent;
  font-size: 16px;
  color: var(--sub);
  padding: 6px 10px;
}

/* =========================
   Buttons
========================= */

.primary-btn {
  border: none;
  background: var(--orange);
  color: white;
  border-radius: 14px;
  padding: 11px 17px;
  font-weight: 600;
  box-shadow: 0 5px 15px rgba(233,139,92,.18);
}

.primary-btn:hover {
  opacity: .92;
}

.secondary-btn {
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  border-radius: 12px;
  padding: 9px 14px;
}

.danger-btn {
  border: none;
  background: #FFF0EE;
  color: #D76E65;
  border-radius: 12px;
  padding: 9px 14px;
}

/* =========================
   Cards
========================= */

.card {
  background: var(--card);
  border: 1px solid rgba(238,236,231,.8);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.card-title h2 {
  margin: 0;
  font-size: 19px;
}

.card-title small {
  color: var(--sub);
}

/* =========================
   Hero
========================= */

.hero-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.hero {
  min-height: 270px;
  padding: 28px 34px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 85% 100%, #FFD087 0, #FFD087 14%, transparent 14.5%),
    radial-gradient(circle at 65% 25%, rgba(255,255,255,.72) 0, rgba(255,255,255,.72) 12%, transparent 12.5%),
    linear-gradient(120deg, #FFF7ED, #FFF2E5 55%, #FFE1B2);
}

.hero::after {
  content: "";
  position: absolute;
  width: 330px;
  height: 180px;
  right: -100px;
  bottom: -110px;
  border-radius: 50%;
  background: rgba(244,201,93,.65);
}

.hero-year {
  font-size: 17px;
  margin-bottom: 15px;
}

.hero-total {
  font-size: 54px;
  font-weight: 650;
  letter-spacing: -2px;
  margin-bottom: 3px;
}

.hero-label {
  color: var(--sub);
  font-size: 14px;
}

.hero-change {
  margin-top: 23px;
  font-size: 17px;
  color: #3E9B78;
  font-weight: 600;
}

.hero-change span {
  color: var(--sub);
  font-weight: 400;
  font-size: 14px;
  margin-left: 8px;
}

.hero-decoration {
  position: absolute;
  right: 80px;
  top: 75px;
  font-size: 20px;
  transform: rotate(-8deg);
  color: #51453C;
  z-index: 2;
}

.hero-decoration::after {
  content: "☺";
  display: block;
  text-align: right;
  margin-top: 15px;
  transform: rotate(8deg);
  font-size: 24px;
}

/* =========================
   AI Summary
========================= */

.ai-card {
  padding: 25px 28px;
  min-height: 270px;
}

.ai-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.ai-heading h2 {
  margin: 0;
  font-size: 19px;
}

.ai-badge {
  font-size: 12px;
  color: #8A6B38;
  background: #FFF6DD;
  border-radius: 20px;
  padding: 5px 9px;
}

.ai-summary {
  color: #55585D;
  font-size: 14px;
  line-height: 1.75;
  margin-bottom: 18px;
}

.ai-insights {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.ai-insight {
  border-radius: 14px;
  padding: 12px 11px;
  min-height: 70px;
}

.ai-insight.orange {
  background: #FFF3EC;
}

.ai-insight.blue {
  background: #EFF7F9;
}

.ai-insight.yellow {
  background: #FFF8E6;
}

.ai-insight-title {
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 5px;
}

.ai-insight-value {
  font-size: 15px;
  font-weight: 650;
}

.ai-advice {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: #64676B;
}

/* =========================
   Second row
========================= */

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.structure-card,
.trend-card {
  padding: 25px 28px;
  min-height: 350px;
}

/* =========================
   Donut
========================= */

.structure-content {
  display: flex;
  align-items: center;
  gap: 30px;
}

.donut-wrap {
  width: 220px;
  height: 220px;
  position: relative;
  flex: 0 0 220px;
}

.donut {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    var(--orange) 0% 29.8%,
    var(--yellow) 29.8% 51.9%,
    var(--blue) 51.9% 62.3%,
    #9BC7BB 62.3% 71.0%,
    #6EA8B8 71.0% 77.3%,
    #D7D7D7 77.3% 100%
  );
  position: relative;
}

.donut::after {
  content: "";
  position: absolute;
  inset: 43px;
  border-radius: 50%;
  background: white;
}

.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 2;
}

.donut-center strong {
  font-size: 17px;
}

.donut-center span {
  font-size: 12px;
  color: var(--sub);
  margin-top: 4px;
}

.legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
}

.legend-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* =========================
   Line Chart
========================= */

.trend-card {
  overflow: hidden;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chart-legend {
  display: flex;
  gap: 16px;
  color: var(--sub);
  font-size: 12px;
}

.chart-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.chart-line {
  width: 18px;
  height: 3px;
  border-radius: 3px;
}

.chart-area {
  position: relative;
  width: 100%;
  height: 260px;
  margin-top: 5px;
}

.chart-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.chart-grid-line {
  stroke: #EEEDE9;
  stroke-width: 1;
}

.chart-axis-text {
  fill: #888B90;
  font-size: 11px;
}

.current-line {
  fill: none;
  stroke: var(--orange);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.previous-line {
  fill: none;
  stroke: var(--blue);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.current-dot {
  fill: white;
  stroke: var(--orange);
  stroke-width: 3;
}

.previous-dot {
  fill: white;
  stroke: var(--blue);
  stroke-width: 3;
}

.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(41,43,47,.94);
  color: white;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.6;
  display: none;
  z-index: 10;
  white-space: nowrap;
}

/* =========================
   Third row
========================= */

.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.store-card,
.ai-detail-card {
  padding: 25px 28px;
  min-height: 300px;
}

/* =========================
   Stores
========================= */

.store-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.store-row {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 11px 8px;
  border-radius: 13px;
}

.store-row:hover {
  background: #FAF9F6;
}

.store-rank {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #F7F3EC;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sub);
  font-size: 12px;
  font-weight: 600;
}

.store-name {
  font-size: 14px;
  font-weight: 600;
}

.store-frequency {
  color: var(--sub);
  font-size: 12px;
  margin-top: 3px;
}

.store-amount {
  text-align: right;
  font-size: 14px;
  font-weight: 600;
}

.store-amount span {
  display: block;
  font-size: 11px;
  color: var(--sub);
  font-weight: 400;
  margin-top: 3px;
}

/* =========================
   AI Detail
========================= */

.ai-detail-section {
  margin-bottom: 15px;
}

.ai-detail-section:last-child {
  margin-bottom: 0;
}

.ai-detail-label {
  font-size: 13px;
  font-weight: 650;
  margin-bottom: 6px;
}

.ai-detail-text {
  font-size: 13px;
  color: #62656A;
  line-height: 1.7;
}

.ai-focus {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.ai-focus-item {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  background: #FAF9F6;
}

.ai-focus-item strong {
  display: block;
  font-size: 14px;
  margin-bottom: 4px;
}

.ai-focus-item span {
  font-size: 12px;
  color: var(--sub);
}

/* =========================
   Details
========================= */

.details-page {
  display: none;
}

.details-summary {
  display: flex;
  gap: 14px;
  margin-bottom: 18px;
}

.summary-box {
  flex: 1;
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 17px 19px;
}

.summary-label {
  color: var(--sub);
  font-size: 12px;
}

.summary-value {
  margin-top: 6px;
  font-size: 22px;
  font-weight: 650;
}

.filters {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 15px;
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-input,
.filter-select {
  height: 39px;
  border: 1px solid var(--border);
  background: #FAF9F6;
  border-radius: 11px;
  padding: 0 12px;
  color: var(--text);
}

.filter-search {
  min-width: 230px;
}

.expense-group {
  margin-bottom: 20px;
}

.expense-date-title {
  font-size: 14px;
  font-weight: 650;
  color: var(--sub);
  margin: 0 0 9px 5px;
}

.expense-list {
  background: white;
  border-radius: 18px;
  border: 1px solid var(--border);
  overflow: hidden;
}

.expense-row {
  display: grid;
  grid-template-columns: 90px 1fr 150px 100px 70px;
  align-items: center;
  padding: 15px 18px;
  border-bottom: 1px solid #F2F0EC;
  gap: 12px;
}

.expense-row:last-child {
  border-bottom: none;
}

.expense-time {
  color: var(--sub);
  font-size: 13px;
}

.expense-store {
  font-weight: 600;
  font-size: 14px;
}

.expense-content {
  color: var(--sub);
  font-size: 12px;
  margin-top: 4px;
}

.expense-amount {
  font-weight: 650;
  text-align: right;
}

.expense-category {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
}

.edit-btn {
  border: none;
  background: #F5F3EE;
  color: #62656A;
  border-radius: 9px;
  padding: 7px 8px;
  font-size: 12px;
}

/* =========================
   Modal
========================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(41,43,47,.28);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  width: min(600px, calc(100vw - 30px));
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: white;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.16);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 21px;
}

.close-btn {
  border: none;
  background: #F5F3EE;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 12px;
  color: var(--sub);
}

.form-group input,
.form-group select {
  height: 43px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0 12px;
  background: #FCFBF9;
  color: var(--text);
  outline: none;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--orange);
}

.modal-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 25px;
}

.footer-right {
  display: flex;
  gap: 9px;
}

.empty {
  text-align: center;
  color: var(--sub);
  padding: 50px 20px;
}

/* =========================
   Mobile
========================= */

.mobile-nav {
  display: none;
}

@media (max-width: 1050px) {
  .sidebar {
    width: 220px;
  }

  .main {
    margin-left: 220px;
    width: calc(100% - 220px);
  }

  .hero-grid,
  .dashboard-grid,
  .bottom-grid {
    grid-template-columns: 1fr;
  }

  .hero-decoration {
    right: 50px;
  }
}

@media (max-width: 720px) {
  .sidebar {
    display: none;
  }

  .main {
    margin-left: 0;
    width: 100%;
    padding: 16px;
    padding-bottom: 85px;
  }

  .topbar {
    display: none;
  }

  .page-title {
    margin-top: 5px;
  }

  .page-title h1 {
    font-size: 24px;
  }

  .hero {
    min-height: 230px;
    padding: 23px;
  }

  .hero-total {
    font-size: 40px;
  }

  .hero-decoration {
    display: none;
  }

  .ai-insights {
    grid-template-columns: 1fr;
  }

  .structure-content {
    flex-direction: column;
  }

  .donut-wrap {
    width: 190px;
    height: 190px;
    flex-basis: 190px;
  }

  .dashboard-grid,
  .bottom-grid {
    gap: 14px;
  }

  .details-summary {
    flex-wrap: wrap;
  }

  .summary-box {
    min-width: calc(50% - 7px);
  }

  .expense-row {
    grid-template-columns: 60px 1fr auto;
  }

  .expense-category,
  .edit-btn {
    display: none;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  .mobile-nav {
    position: fixed;
    display: flex;
    bottom: 0;
    left: 0;
    right: 0;
    height: 67px;
    background: rgba(255,255,255,.96);
    border-top: 1px solid var(--border);
    z-index: 90;
    justify-content: space-around;
    align-items: center;
  }

  .mobile-nav button {
    border: none;
    background: none;
    color: var(--sub);
    font-size: 11px;
  }

  .mobile-nav button.active {
    color: var(--orange);
    font-weight: 600;
  }

  .mobile-add {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: var(--orange);
    color: white;
    font-size: 23px;
    margin-top: -23px;
    box-shadow: 0 6px 18px rgba(233,139,92,.25);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       Sidebar
  ========================== -->
  <aside class="sidebar">

    <div class="brand">
      <span class="brand-icon">☀️</span>
      <span>My Finance</span>
    </div>

    <nav class="nav">
      <button id="navOverview" class="active" onclick="showPage('overview')">
        <span class="nav-icon">⌂</span>
        全年纵览
      </button>

      <button id="navDetails" onclick="showPage('details')">
        <span class="nav-icon">☷</span>
        花销明细
      </button>
    </nav>

    <div class="quick-title">快捷入口</div>

    <div class="quick-actions">

      <button class="quick-btn voice" onclick="openAddModal()">
        <span class="quick-icon">🎙</span>
        <span>语音记账</span>
      </button>

      <button class="quick-btn photo" onclick="openAddModal()">
        <span class="quick-icon">📷</span>
        <span>拍小票</span>
      </button>

      <button class="quick-btn manual" onclick="openAddModal()">
        <span class="quick-icon">✎</span>
        <span>手动输入</span>
      </button>

    </div>

  </aside>


  <!-- =========================
       Main
  ========================== -->

  <main class="main">

    <div class="topbar">
      <div class="search-box">
        <span>⌕</span>

<script>

/* =========================================================
   My Finance v4.1
========================================================= */


/* =========================================================
   1. API URL
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxb--pgAmPuBxtOUt2N7PTsU4C5D8-i7DhvXbcmL69OLRCNHiTDPyjU7ZmuV5loMZwfYA/exec';


/* =========================================================
   2. Global Data
========================================================= */

let expenses = [];
let settings = {
  payments: [],
  large: [],
  middle: [],
  rules: []
};

let editingRow = null;


/* =========================================================
   3. Basic Helpers
========================================================= */

function yen(value) {

  return '¥' + Number(value || 0)
    .toLocaleString('ja-JP', {
      maximumFractionDigits: 0
    });

}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function parseDate(value) {

  if (!value) return null;

  if (value instanceof Date) {
    return value;
  }

  const d = new Date(value);

  if (!isNaN(d.getTime())) {
    return d;
  }

  const normalized = String(value)
    .replace(/\//g, '-')
    .replace(' ', 'T');

  const d2 = new Date(normalized);

  return isNaN(d2.getTime()) ? null : d2;

}


function formatDateInput(value) {

  const d = parseDate(value);

  if (!d) return '';

  const pad = n => String(n).padStart(2, '0');

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
       + `T${pad(d.getHours())}:${pad(d.getMinutes())}`;

}


function formatDate(value) {

  const d = parseDate(value);

  if (!d) return '';

  const pad = n => String(n).padStart(2, '0');

  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`
       + ` ${pad(d.getHours())}:${pad(d.getMinutes())}`;

}


function getYear(expense) {

  const d = parseDate(expense['日付']);

  return d ? d.getFullYear() : null;

}


function getMonth(expense) {

  const d = parseDate(expense['日付']);

  return d ? d.getMonth() + 1 : null;

}


function isIncluded(expense) {

  return Number(expense['計算対象']) === 1;

}


/* =========================================================
   4. Load Data
========================================================= */

async function loadData() {

  try {

    const response = await fetch(
      API_URL + '?action=all'
    );

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || '数据读取失败');
    }

    expenses = data.expenses || [];
    settings = data.settings || {
      payments: [],
      large: [],
      middle: [],
      rules: []
    };

    initYearSelect();
    initFormSettings();
    renderOverview();
    renderDetails();

  } catch (error) {

    console.error(error);

    alert(
      '读取数据失败。\n\n' +
      '请确认 API_URL 是否填写正确，以及 Apps Script Web App 是否已部署。'
    );

  }

}


/* =========================================================
   5. Page Navigation
========================================================= */

function showPage(page) {

  const overview =
    document.getElementById('overviewPage');

  const details =
    document.getElementById('detailsPage');

  const navOverview =
    document.getElementById('navOverview');

  const navDetails =
    document.getElementById('navDetails');

  const mobileOverview =
    document.getElementById('mobileOverview');

  const mobileDetails =
    document.getElementById('mobileDetails');


  if (page === 'overview') {

    overview.style.display = 'block';
    details.style.display = 'none';

    navOverview.classList.add('active');
    navDetails.classList.remove('active');

    mobileOverview.classList.add('active');
    mobileDetails.classList.remove('active');

    renderOverview();

  } else {

    overview.style.display = 'none';
    details.style.display = 'block';

    navOverview.classList.remove('active');
    navDetails.classList.add('active');

    mobileOverview.classList.remove('active');
    mobileDetails.classList.add('active');

    renderDetails();

  }

}


/* =========================================================
   6. Year
========================================================= */

function initYearSelect() {

  const select =
    document.getElementById('yearSelect');

  const years = new Set();

  expenses.forEach(expense => {

    const year = getYear(expense);

    if (year) {
      years.add(year);
    }

  });

  const currentYear =
    new Date().getFullYear();

  years.add(currentYear);
  years.add(currentYear - 1);

  const sortedYears =
    [...years].sort((a,b) => b-a);

  select.innerHTML =
    sortedYears.map(year =>
      `<option value="${year}">${year}</option>`
    ).join('');

  select.value = currentYear;

  select.onchange = () => {
    renderOverview();
  };

}


/* =========================================================
   7. Overview
========================================================= */

function getSelectedYear() {

  return Number(
    document.getElementById('yearSelect').value
  );

}


function getYearExpenses(year) {

  return expenses.filter(expense => {

    return getYear(expense) === year &&
           isIncluded(expense);

  });

}


function renderOverview() {

  const year = getSelectedYear();

  const current =
    getYearExpenses(year);

  const previous =
    getYearExpenses(year - 1);


  renderHero(
    year,
    current,
    previous
  );

  renderStructure(current);

  renderTrend(
    year
  );

  renderStores(current);

  renderAI(
    year,
    current,
    previous
  );

}


function totalOf(list) {

  return list.reduce(
    (sum, expense) =>
      sum + Number(expense['金額'] || 0),
    0
  );

}


/* =========================================================
   8. Hero
========================================================= */

function renderHero(
  year,
  current,
  previous
) {

  const currentTotal =
    totalOf(current);

  const previousTotal =
    totalOf(previous);


  document.getElementById(
    'heroYear'
  ).textContent = year;


  document.getElementById(
    'annualTotal'
  ).textContent = yen(currentTotal);


  let changeHtml = '—';

  if (previousTotal > 0) {

    const change =
      ((currentTotal - previousTotal) /
        previousTotal) * 100;

    const arrow =
      change > 0 ? '↑' : '↓';

    const sign =
      change > 0 ? '+' : '';

    changeHtml =
      `${arrow} ${sign}${change.toFixed(1)}%`
      + `<span>较去年同期</span>`;

  }

  document.getElementById(
    'annualChange'
  ).innerHTML = changeHtml;


  document.getElementById(
    'donutTotal'
  ).textContent = yen(currentTotal);

}


/* =========================================================
   9. Category Structure
========================================================= */

const categoryColors = [
  '#E98B5C',
  '#F4C95D',
  '#8FAFC0',
  '#9BC7BB',
  '#6EA8B8',
  '#D7D7D7',
  '#E98278',
  '#B9A5C9',
  '#C9B78D',
  '#A7A9AC'
];


function renderStructure(current) {

  const total =
    totalOf(current);

  const map = {};

  current.forEach(expense => {

    const category =
      expense['大項目'] || 'その他';

    map[category] =
      (map[category] || 0)
      + Number(expense['金額'] || 0);

  });


  const entries =
    Object.entries(map)
      .sort((a,b) => b[1] - a[1]);


  const legend =
    document.getElementById(
      'categoryLegend'
    );


  if (!entries.length) {

    legend.innerHTML =
      `<div class="empty">暂无数据</div>`;

    return;

  }


  legend.innerHTML =
    entries.slice(0, 8).map(
      ([name, value], index) => {

        const percent =
          total > 0
            ? value / total * 100
            : 0;

        return `
          <div class="legend-item">

            <div class="legend-left">

              <span
                class="legend-dot"
                style="
                  background:
                  ${categoryColors[index % categoryColors.length]}
                ">
              </span>

              <span>${escapeHtml(name)}</span>

            </div>

            <span>
              ${percent.toFixed(1)}%
            </span>

          </div>
        `;

      }
    ).join('');


  /*
   * Rebuild donut dynamically.
   */

  let gradientParts = [];
  let accumulated = 0;

  entries.forEach(
    ([name, value], index) => {

      const percent =
        total > 0
          ? value / total * 100
          : 0;

      const start = accumulated;

      accumulated += percent;

      gradientParts.push(
        `${categoryColors[index % categoryColors.length]}
         ${start}% ${accumulated}%`
      );

    }
  );


  document.getElementById(
    'donutChart'
  ).style.background =
    total > 0
      ? `conic-gradient(${gradientParts.join(',')})`
      : '#E6E6E6';

}


/* =========================================================
   10. Monthly Trend
========================================================= */

function getMonthlyTotals(year) {

  const result =
    Array(12).fill(0);

  getYearExpenses(year)
    .forEach(expense => {

      const month =
        getMonth(expense);

      if (month) {

        result[month - 1] +=
          Number(expense['金額'] || 0);

      }

    });

  return result;

}


function renderTrend(year) {

  const current =
    getMonthlyTotals(year);

  const previous =
    getMonthlyTotals(year - 1);


  const svg =
    document.getElementById(
      'trendSvg'
    );


  const width = 700;
  const height = 250;

  const left = 45;
  const right = 12;
  const top = 18;
  const bottom = 32;

  const chartWidth =
    width - left - right;

  const chartHeight =
    height - top - bottom;


  const allValues =
    [...current, ...previous];

  const maxValue =
    Math.max(...allValues, 1000);

  const gridMax =
    Math.ceil(maxValue / 50000) * 50000;


  let html = '';


  /*
   * Grid
   */

  for (let i = 0; i <= 4; i++) {

    const y =
      top + chartHeight * i / 4;

    const value =
      gridMax * (1 - i / 4);

    html += `
      <line
        class="chart-grid-line"
        x1="${left}"
        y1="${y}"
        x2="${width-right}"
        y2="${y}">
      </line>

      <text
        class="chart-axis-text"
        x="0"
        y="${y + 4}">
        ${formatCompactYen(value)}
      </text>
    `;

  }


  /*
   * Month labels
   */

  for (let i = 0; i < 12; i++) {

    const x =
      left +
      chartWidth * i / 11;

    html += `
      <text
        class="chart-axis-text"
        text-anchor="middle"
        x="${x}"
        y="${height - 5}">
        ${i + 1}月
      </text>
    `;

  }


  /*
   * Lines
   */

  const currentPoints =
    createChartPoints(
      current,
      gridMax,
      left,
      top,
      chartWidth,
      chartHeight
    );

  const previousPoints =
    createChartPoints(
      previous,
      gridMax,
      left,
      top,
      chartWidth,
      chartHeight
    );


  html += `
    <polyline
      class="previous-line"
      points="${previousPoints.map(p => `${p.x},${p.y}`).join(' ')}">
    </polyline>

    <polyline
      class="current-line"
      points="${currentPoints.map(p => `${p.x},${p.y}`).join(' ')}">
    </polyline>
  `;


  /*
   * Dots
   */

  previousPoints.forEach(
    (point, index) => {

      html += `
        <circle
          class="previous-dot"
          cx="${point.x}"
          cy="${point.y}"
          r="3.5"
          data-year="${year - 1}"
          data-month="${index + 1}"
          data-value="${previous[index]}">
        </circle>
      `;

    }
  );


  currentPoints.forEach(
    (point, index) => {

      html += `
        <circle
          class="current-dot"
          cx="${point.x}"
          cy="${point.y}"
          r="4"
          data-year="${year}"
          data-month="${index + 1}"
          data-value="${current[index]}">
        </circle>
      `;

    }
  );


  svg.innerHTML = html;


  /*
   * Hover interaction
   */

  svg.querySelectorAll(
    'circle[data-value]'
  ).forEach(dot => {

    dot.addEventListener(
      'mouseenter',
      event => {

        const target =
          event.currentTarget;

        const targetYear =
          target.dataset.year;

        const month =
          target.dataset.month;

        const value =
          Number(target.dataset.value);


        const tooltip =
          document.getElementById(
            'chartTooltip'
          );


        tooltip.innerHTML =
          `${targetYear}年 ${month}月<br>`
          + `<strong>${yen(value)}</strong>`;


        tooltip.style.display = 'block';


        const x =
          Number(target.getAttribute('cx'));

        const y =
          Number(target.getAttribute('cy'));


        const chartArea =
          document.querySelector(
            '.chart-area'
          );

        const areaWidth =
          chartArea.clientWidth;


        tooltip.style.left =
          Math.min(
            areaWidth - 100,
            Math.max(0, x / width * areaWidth - 35)
          ) + 'px';


        tooltip.style.top =
          Math.max(
            0,
            y - 55
          ) + 'px';

      }
    );


    dot.addEventListener(
      'mouseleave',
      () => {

        document.getElementById(
          'chartTooltip'
        ).style.display = 'none';

      }
    );

  });

}


function createChartPoints(
  values,
  max,
  left,
  top,
  chartWidth,
  chartHeight
) {

  return values.map(
    (value, index) => {

      const x =
        left +
        chartWidth * index / 11;

      const y =
        top +
        chartHeight -
        (value / max) * chartHeight;

      return {
        x,
        y
      };

    }
  );

}


function formatCompactYen(value) {

  if (value >= 1000000) {
    return '¥' +
      (value / 1000000).toFixed(1) +
      'M';
  }

  if (value >= 1000) {
    return '¥' +
      Math.round(value / 1000) +
      'k';
  }

  return '¥' + Math.round(value);

}


/* =========================================================
   11. Frequent Stores
========================================================= */

function renderStores(current) {

  const map = {};

  current.forEach(expense => {

    const store =
      String(expense['店舗'] || '')
        .trim();

    if (!store) return;

    if (!map[store]) {

      map[store] = {
        count: 0,
        amount: 0
      };

    }

    map[store].count++;

    map[store].amount +=
      Number(expense['金額'] || 0);

  });


  const stores =
    Object.entries(map)
      .map(([name, data]) => ({
        name,
        ...data
      }))
      .sort((a,b) => {

        if (b.count !== a.count) {
          return b.count - a.count;
        }

        return b.amount - a.amount;

      })
      .slice(0, 5);


  const container =
    document.getElementById(
      'storeList'
    );


  if (!stores.length) {

    container.innerHTML =
      `<div class="empty">暂无店铺数据</div>`;

    return;

  }


  container.innerHTML =
    stores.map(
      (store, index) => {

        return `
          <div class="store-row">

            <div class="store-rank">
              ${index + 1}
            </div>

            <div>

              <div class="store-name">
                ${escapeHtml(store.name)}
              </div>

              <div class="store-frequency">
                ${store.count} 次
              </div>

            </div>

            <div class="store-amount">

              ${yen(store.amount)}

              <span>
                总消费
              </span>

            </div>

          </div>
        `;

      }
    ).join('');

}


/* =========================================================
   12. AI Annual Summary
========================================================= */

function renderAI(
  year,
  current,
  previous
) {

  const total =
    totalOf(current);

  const previousTotal =
    totalOf(previous);


  /*
   * Category
   */

  const categoryMap = {};

  current.forEach(expense => {

    const category =
      expense['大項目'] || 'その他';

    categoryMap[category] =
      (categoryMap[category] || 0)
      + Number(expense['金額'] || 0);

  });


  const categories =
    Object.entries(categoryMap)
      .sort((a,b) => b[1] - a[1]);


  const topCategory =
    categories[0]
      ? categories[0][0]
      : '—';


  const topCategoryAmount =
    categories[0]
      ? categories[0][1]
      : 0;


  const topCategoryPercent =
    total > 0
      ? topCategoryAmount / total * 100
      : 0;


  /*
   * Month
   */

  const months =
    getMonthlyTotals(year);

  let maxMonthIndex = 0;

  months.forEach(
    (value, index) => {

      if (
        value >
        months[maxMonthIndex]
      ) {
        maxMonthIndex = index;
      }

    }
  );


  const topMonth =
    months[maxMonthIndex] > 0
      ? `${maxMonthIndex + 1}月`
      : '—';


  /*
   * Store
   */

  const storeMap = {};

  current.forEach(expense => {

    const store =
      String(expense['店舗'] || '')
        .trim();

    if (!store) return;

    storeMap[store] =
      (storeMap[store] || 0) + 1;

  });


  const topStore =
    Object.entries(storeMap)
      .sort((a,b) => b[1] - a[1])[0];


  const topStoreName =
    topStore
      ? topStore[0]
      : '—';


  const topStoreCount =
    topStore
      ? topStore[1]
      : 0;


  document.getElementById(
    'aiTopCategory'
  ).textContent =
    topCategory;


  document.getElementById(
    'aiTopMonth'
  ).textContent =
    topMonth;


  document.getElementById(
    'aiTopStore'
  ).textContent =
    topStoreName;


  /*
   * Main summary
   */

  let summary = '';

  if (!current.length) {

    summary =
      `${year}年目前还没有计入年度统计的消费记录。`;

  } else {

    const average =
      total / 12;

    summary =
      `${year}年的累计支出为 ${yen(total)}，`
      + `平均每月约 ${yen(average)}。`;

    if (previousTotal > 0) {

      const change =
        ((total - previousTotal) /
          previousTotal) * 100;

      if (change < 0) {

        summary +=
          `相比去年同期下降 ${Math.abs(change).toFixed(1)}%，`
          + `整体支出有所减少。`;

      } else {

        summary +=
          `相比去年同期增加 ${change.toFixed(1)}%，`
          + `整体支出有所增加。`;

      }

    }

    summary +=
      `其中「${topCategory}」是最大的支出类别，`
      + `占全年支出的 ${topCategoryPercent.toFixed(1)}%。`;

  }


  document.getElementById(
    'aiSummary'
  ).textContent = summary;


  /*
   * Advice
   */

  let advice =
    '💡 建议：继续保持对主要支出类别的关注。';


  if (topCategory === '食費') {

    advice =
      '💡 建议：如果希望降低整体支出，可以优先关注外食频率，而不是削减低占比的日用品支出。';

  } else if (topCategory === '趣味・娯楽') {

    advice =
      '💡 建议：可以进一步观察旅行、票券和订阅服务的具体支出变化。';

  } else if (topCategory === '日用品') {

    advice =
      '💡 建议：可以关注高频购买的店铺和重复购买的日用品。';

  } else if (topCategory === '交通費') {

    advice =
      '💡 建议：可以结合月度趋势观察是否存在集中出行导致的高峰月份。';

  }


  document.getElementById(
    'aiAdvice'
  ).textContent = advice;


  /*
   * Detail analysis
   */

  document.getElementById(
    'aiDetail1'
  ).textContent =
    current.length
      ? `今年共有 ${current.length} 笔计入年度统计的消费记录。`
        + ` 最大支出类别为「${topCategory}」，`
        + `占全年支出的 ${topCategoryPercent.toFixed(1)}%。`
      : '目前还没有足够的数据进行分析。';


  document.getElementById(
    'aiDetail2'
  ).textContent =
    months[maxMonthIndex] > 0
      ? `${topMonth}是目前消费最高的月份，`
        + `当月支出为 ${yen(months[maxMonthIndex])}。`
        + `可以结合该月的明细进一步确认高支出的原因。`
      : '目前还没有足够的月度数据。';


  document.getElementById(
    'aiDetail3'
  ).textContent =
    `最常去的店铺是「${topStoreName}」，`
    + `共记录 ${topStoreCount} 次。`
    + `建议重点关注高频消费，而不仅仅是单笔金额较大的消费。`;


  document.getElementById(
    'focusCategory'
  ).textContent =
    topCategory;


  document.getElementById(
    'focusStore'
  ).textContent =
    topStoreName;

}


/* =========================================================
   13. Settings
========================================================= */

function initFormSettings() {

  const payment =
    document.getElementById(
      'formPayment'
    );

  const large =
    document.getElementById(
      'formLarge'
    );


  payment.innerHTML =
    settings.payments
      .map(item =>
        `<option value="${escapeHtml(item)}">
          ${escapeHtml(item)}
        </option>`
      )
      .join('');


  large.innerHTML =
    settings.large
      .map(item =>
        `<option value="${escapeHtml(item)}">
          ${escapeHtml(item)}
        </option>`
      )
      .join('');


  large.onchange =
    updateMiddleOptions;


  updateMiddleOptions();

}


function updateMiddleOptions() {

  const large =
    document.getElementById(
      'formLarge'
    ).value;


  const middle =
    document.getElementById(
      'formMiddle'
    );


  const options =
    settings.middle
      .filter(item => {

        /*
         * 支持常见 Settings 数据结构：
         *
         * 如果中项目对象包含大项目，
         * 则按照关系过滤。
         *
         * 如果是纯字符串，
         * 则尝试从规则表判断。
         */

        if (typeof item === 'string') {

          return true;

        }

        return (
          item['大項目'] === large ||
          item.large === large
        );

      });


  if (
    options.length === 0
  ) {

    middle.innerHTML = '';

    return;

  }


  middle.innerHTML =
    options.map(item => {

      const value =
        typeof item === 'string'
          ? item
          : (
              item['中項目'] ||
              item.middle ||
              ''
            );

      return `
        <option value="${escapeHtml(value)}">
          ${escapeHtml(value)}
        </option>
      `;

    }).join('');

}

function openEditModal(expense) {

  editingRow =
    expense.rowNumber;


  document.getElementById(
    'modalTitle'
  ).textContent = '编辑花销';


  document.getElementById(
    'deleteBtn'
  ).style.display = 'block';


  document.getElementById(
    'formDate'
  ).value =
    formatDateInput(
      expense['日付']
    );


  document.getElementById(
    'formStore'
  ).value =
    expense['店舗'] || '';


  document.getElementById(
    'formAmount'
  ).value =
    expense['金額'] || '';


  document.getElementById(
    'formPayment'
  ).value =
    expense['支払方法'] || '';


  document.getElementById(
    'formLarge'
  ).value =
    expense['大項目'] || '';


  updateMiddleOptions();


  document.getElementById(
    'formMiddle'
  ).value =
    expense['中項目'] || '';


  document.getElementById(
    'formContent'
  ).value =
    expense['内容'] || '';


  document.getElementById(
    'modalOverlay'
  ).style.display = 'flex';

}


function closeModal() {

  document.getElementById(
    'modalOverlay'
  ).style.display = 'none';

}


/* =========================================================
   15. Save
========================================================= */

async function saveCurrentExpense() {

  const date =
    document.getElementById(
      'formDate'
    ).value;


  const store =
    document.getElementById(
      'formStore'
    ).value.trim();


  const amount =
    Number(
      document.getElementById(
        'formAmount'
      ).value
    );


  const payment =
    document.getElementById(
      'formPayment'
    ).value;


  const large =
    document.getElementById(
      'formLarge'
    ).value;


  const middle =
    document.getElementById(
      'formMiddle'
    ).value;


  const content =
    document.getElementById(
      'formContent'
    ).value.trim();


  if (!date || !store || !amount ||
      !payment || !large ||
      !middle || !content) {

    alert(
      '请完整填写日期、店舗、金额、支付方式、大项目、中项目和内容。'
    );

    return;

  }


  const payload = {

    action:
      editingRow
        ? 'update'
        : 'add',

    rowNumber:
      editingRow || undefined,

    '日付':
      date,

    '店舗':
      store,

    '金額':
      amount,

    '支払方法':
      payment,

    '大項目':
      large,

    '中項目':
      middle,

    '内容':
      content

  };


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',
          body: JSON.stringify(payload)
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        '保存失败'
      );

    }


    closeModal();

    await loadData();

  } catch (error) {

    console.error(error);

    alert(
      '保存失败：\n' +
      error.message
    );

  }

}


/* =========================================================
   16. Delete
========================================================= */

async function deleteCurrentExpense() {

  if (!editingRow) {
    return;
  }


  const confirmed =
    confirm(
      '确定要删除这笔花销吗？\n\n删除后无法恢复。'
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',
          body: JSON.stringify({
            action: 'delete',
            rowNumber: editingRow
          })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        '删除失败'
      );

    }


    closeModal();

    await loadData();

  } catch (error) {

    console.error(error);

    alert(
      '删除失败：\n' +
      error.message
    );

  }

}


/* =========================================================
   17. Details
========================================================= */

function initDetailFilters() {

  const category =
    document.getElementById(
      'filterCategory'
    );


  category.innerHTML =
    `<option value="">全部大项目</option>`
    +
    settings.large.map(
      item =>
        `<option value="${escapeHtml(item)}">
          ${escapeHtml(item)}
        </option>`
    ).join('');


  document.getElementById(
    'filterMonth'
  ).onchange =
    renderDetails;


  category.onchange =
    renderDetails;


  document.getElementById(
    'filterSearch'
  ).oninput =
    renderDetails;

}


function renderDetails() {

  if (!settings.large.length) {
    return;
  }


  initDetailFiltersOnce();


  const year =
    getSelectedYear();


  const month =
    document.getElementById(
      'filterMonth'
    ).value;


  const category =
    document.getElementById(
      'filterCategory'
    ).value;


  const search =
    document.getElementById(
      'filterSearch'
    ).value
      .trim()
      .toLowerCase();


  const filtered =
    expenses
      .filter(expense => {

        if (
          getYear(expense) !== year
        ) {
          return false;
        }

        if (
          month &&
          String(getMonth(expense)) !==
          String(month)
        ) {
          return false;
        }

        if (
          category &&
          expense['大項目'] !== category
        ) {
          return false;
        }

        if (search) {

          const text =
            `${expense['店舗'] || ''} `
            + `${expense['内容'] || ''} `
            + `${expense['大項目'] || ''} `
            + `${expense['中項目'] || ''}`
            .toLowerCase();

          if (!text.includes(search)) {
            return false;
          }

        }

        return true;

      })
      .sort(
        (a,b) => {

          const da =
            parseDate(a['日付'])?.getTime() || 0;

          const db =
            parseDate(b['日付'])?.getTime() || 0;

          return db - da;

        }
      );


  const included =
    filtered.filter(isIncluded);


  document.getElementById(
    'filteredTotal'
  ).textContent =
    yen(totalOf(included));


  document.getElementById(
    'filteredCount'
  ).textContent =
    filtered.length;


  const container =
    document.getElementById(
      'expenseContainer'
    );


  if (!filtered.length) {

    container.innerHTML =
      `<div class="card empty">
        暂无符合条件的花销记录
      </div>`;

    return;

  }


  const groups = {};

  filtered.forEach(expense => {

    const d =
      parseDate(expense['日付']);

    const key =
      d
        ? `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`
        : '日期未知';


    if (!groups[key]) {
      groups[key] = [];
    }

    groups[key].push(expense);

  });


  container.innerHTML =
    Object.entries(groups)
      .map(
        ([date, list]) => {

          return `
            <div class="expense-group">

              <div class="expense-date-title">
                ${date}
              </div>

              <div class="expense-list">

                ${list.map(
                  expense => {

                    const d =
                      parseDate(
                        expense['日付']
                      );

                    const time =
                      d
                        ? d.toLocaleTimeString(
                            'ja-JP',
                            {
                              hour: '2-digit',
                              minute: '2-digit'
                            }
                          )
                        : '';

                    return `
                      <div class="expense-row">

                        <div class="expense-time">
                          ${time}
                        </div>

                        <div>

                          <div class="expense-store">
                            ${escapeHtml(
                              expense['店舗']
                            )}
                          </div>

                          <div class="expense-content">
                            ${escapeHtml(
                              expense['内容']
                            )}
                          </div>

                        </div>

                        <div class="expense-amount">
                          ${yen(
                            expense['金額']
                          )}
                        </div>

                        <div class="expense-category">
                          ${escapeHtml(
                            expense['中項目'] || ''
                          )}
                        </div>

                        <button
                          class="edit-btn"
                          onclick='openEditModal(${JSON.stringify(expense).replace(/'/g, "&#39;")})'>
                          编辑
                        </button>

                      </div>
                    `;

                  }
                ).join('')}

              </div>

            </div>
          `;

        }
      ).join('');

}


/*
 * Avoid repeatedly replacing filters.
 */

let filtersInitialized = false;

function initDetailFiltersOnce() {

  if (filtersInitialized) {
    return;
  }

  filtersInitialized = true;

  initDetailFilters();

}

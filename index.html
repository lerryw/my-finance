<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Finance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #FAF9F6;
      color: #292B2F;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 28px 60px;
    }

    /* ---------- Header ---------- */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: #E98B5C;
    }

    .header-subtitle {
      margin-top: 5px;
      color: #74777C;
      font-size: 13px;
    }

    .add-button {
      border: none;
      border-radius: 16px;
      background: #E98B5C;
      color: white;
      padding: 12px 19px;
      font-weight: 600;
      box-shadow: 0 5px 14px rgba(233, 139, 92, 0.18);
    }

    .add-button:hover {
      opacity: 0.9;
    }

    /* ---------- Summary ---------- */

    .summary {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .summary-label {
      color: #74777C;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .summary-value.orange {
      color: #E98B5C;
    }

    /* ---------- Filters ---------- */

    .filter-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .filters {
      display: grid;
      grid-template-columns: 170px 190px 1fr;
      gap: 12px;
    }

    .input,
    .select {
      width: 100%;
      border: 1px solid #E7E4DE;
      border-radius: 13px;
      background: #FAF9F6;
      color: #292B2F;
      padding: 11px 13px;
      outline: none;
    }

    .input:focus,
    .select:focus {
      border-color: #E98B5C;
      background: white;
    }

    /* ---------- Expense list ---------- */

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 12px 4px;
    }

    .expense-group {
      margin-bottom: 22px;
    }

    .date-title {
      color: #74777C;
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 8px 5px;
    }

    .expense-list {
      background: #FFFFFF;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .expense-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 21px;
      border-bottom: 1px solid #F0EEE9;
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .expense-main {
      min-width: 0;
    }

    .expense-store {
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 5px;
    }

    .expense-meta {
      color: #74777C;
      font-size: 12px;
    }

    .expense-content {
      color: #74777C;
      margin-left: 5px;
    }

    .expense-right {
      text-align: right;
      flex-shrink: 0;
      margin-left: 20px;
    }

    .expense-amount {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .expense-payment {
      color: #74777C;
      font-size: 11px;
    }

    .empty {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 55px 20px;
      text-align: center;
      color: #74777C;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #74777C;
    }

    .error {
      background: #FFF1EF;
      color: #B9554D;
      border-radius: 16px;
      padding: 15px 18px;
      margin-bottom: 20px;
      display: none;
    }

/* ---------- Modal ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(41, 43, 47, 0.28);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  background: #FFFFFF;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 18px 50px rgba(41, 43, 47, 0.16);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
}

.modal-title {
  font-size: 21px;
  font-weight: 700;
}

.modal-subtitle {
  margin-top: 5px;
  color: #74777C;
  font-size: 12px;
}

.modal-close {
  border: none;
  background: #F4F2ED;
  color: #74777C;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 23px;
  line-height: 1;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.form-group label {
  color: #74777C;
  font-size: 12px;
  font-weight: 600;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-error {
  display: none;
  margin-top: 15px;
  padding: 11px 13px;
  border-radius: 12px;
  background: #FFF1EF;
  color: #B9554D;
  font-size: 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.cancel-button,
.save-button {
  border: none;
  border-radius: 13px;
  padding: 11px 20px;
  font-weight: 600;
}

.cancel-button {
  background: #F4F2ED;
  color: #74777C;
}

.save-button {
  background: #E98B5C;
  color: white;
  min-width: 85px;
}

.save-button:disabled {
  opacity: 0.55;
  cursor: default;
}

@media (max-width: 760px) {

  .modal-overlay {
    align-items: flex-end;
    padding: 0;
  }

  .modal {
    max-height: 92vh;
    border-radius: 24px 24px 0 0;
    padding: 22px 18px 25px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

}
    
    /* ---------- Mobile ---------- */

    @media (max-width: 760px) {

      .app {
        padding: 22px 16px 90px;
      }

      .header {
        margin-bottom: 22px;
      }

      .brand {
        font-size: 22px;
      }

      .header-subtitle {
        font-size: 12px;
      }

      .add-button {
        padding: 10px 14px;
        border-radius: 13px;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-card:first-child {
        grid-column: 1 / -1;
      }

      .summary-card {
        padding: 18px;
        border-radius: 18px;
      }

      .summary-value {
        font-size: 23px;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filters .search {
        grid-column: 1 / -1;
      }

      .filter-card {
        border-radius: 18px;
        padding: 13px;
      }

      .expense-list {
        border-radius: 18px;
      }

      .expense-item {
        padding: 15px 16px;
      }

      .expense-store {
        font-size: 14px;
      }

      .expense-meta {
        font-size: 11px;
      }

      .expense-amount {
        font-size: 15px;
      }

      .expense-right {
        margin-left: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div>
      <div class="brand">My <span>Finance</span></div>
      <div class="header-subtitle">花销明细</div>
    </div>

    <button class="add-button" onclick="addExpense()">
      ＋ 添加支出
    </button>
  </header>


  <!-- Error -->
  <div id="error" class="error"></div>


  <!-- Summary -->
  <section class="summary">

    <div class="summary-card">
      <div class="summary-label">本月支出</div>
      <div id="monthTotal" class="summary-value orange">¥0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">本月笔数</div>
      <div id="monthCount" class="summary-value">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">全部记录</div>
      <div id="allCount" class="summary-value">0</div>
    </div>

  </section>


  <!-- Filters -->
  <section class="filter-card">

    <div class="filters">

      <select id="monthFilter" class="select"
              onchange="renderExpenses()">
        <option value="all">全部月份</option>
      </select>

      <select id="categoryFilter" class="select"
              onchange="renderExpenses()">
        <option value="all">全部大項目</option>
      </select>

      <input
        id="searchFilter"
        class="input search"
        type="search"
        placeholder="搜索店舗 / 内容"
        oninput="renderExpenses()"
      >

    </div>

  </section>


  <!-- Expenses -->
  <section>

    <h2 class="section-title">支出记录</h2>

    <div id="expenseContainer">
      <div class="loading">
        正在读取账目……
      </div>
    </div>

  </section>

</div>


<script>

  /*
   * ==============================================
   * API
   * ==============================================
   */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbxb--pgAmPuBxtOUt2N7PTsU4C5D8-i7DhvXbcmL69OLRCNHiTDPyjU7ZmuV5loMZwfYA/exec';


  /*
   * ==============================================
   * Global data
   * ==============================================
   */

  let expenses = [];
  let settings = {};


  /*
   * ==============================================
   * 初始化
   * ==============================================
   */

  window.addEventListener('DOMContentLoaded', loadData);


  async function loadData() {

    try {

      const response =
        await fetch(API_URL + '?action=all');

      const data =
        await response.json();

      if (!data.success) {
        throw new Error(data.error);
      }

      settings = data.settings;
      expenses = data.expenses || [];

      setupFilters();
      updateSummary();
      renderExpenses();

    } catch (error) {

      showError(
        '读取数据失败：' + error.message
      );

    }
  }


  /*
   * ==============================================
   * Filter setup
   * ==============================================
   */

  function setupFilters() {

    const monthFilter =
      document.getElementById('monthFilter');

    const categoryFilter =
      document.getElementById('categoryFilter');


    // 月份
    const months =
      [...new Set(
        expenses
          .map(expense => getMonthKey(expense.日付))
          .filter(Boolean)
      )].sort().reverse();


    months.forEach(month => {

      const option =
        document.createElement('option');

      option.value = month;
      option.textContent =
        formatMonth(month);

      monthFilter.appendChild(option);

    });


    // 大項目
    (settings.largeCategories || [])
      .forEach(category => {

        const option =
          document.createElement('option');

        option.value = category;
        option.textContent = category;

        categoryFilter.appendChild(option);

      });
  }


  /*
   * ==============================================
   * Summary
   * ==============================================
   */

  function updateSummary() {

    const now = new Date();

    const currentYear =
      now.getFullYear();

    const currentMonth =
      now.getMonth();

    const currentMonthExpenses =
      expenses.filter(expense => {

        if (Number(expense.計算対象) !== 1) {
          return false;
        }

        const date =
          new Date(expense.日付);

        return (
          date.getFullYear() === currentYear &&
          date.getMonth() === currentMonth
        );

      });


    const total =
      currentMonthExpenses.reduce(
        (sum, expense) =>
          sum + Number(expense.金額 || 0),
        0
      );


    document.getElementById('monthTotal')
      .textContent =
      formatCurrency(total);

    document.getElementById('monthCount')
      .textContent =
      currentMonthExpenses.length;

    document.getElementById('allCount')
      .textContent =
      expenses.length;
  }


  /*
   * ==============================================
   * Render expenses
   * ==============================================
   */

  function renderExpenses() {

    const container =
      document.getElementById('expenseContainer');

    const month =
      document.getElementById('monthFilter').value;

    const category =
      document.getElementById('categoryFilter').value;

    const search =
      document.getElementById('searchFilter')
        .value
        .trim()
        .toLowerCase();


    let filtered =
      expenses.filter(expense => {

        const monthMatch =
          month === 'all' ||
          getMonthKey(expense.日付) === month;

        const categoryMatch =
          category === 'all' ||
          expense.大項目 === category;

        const searchMatch =
          !search ||
          String(expense.店舗)
            .toLowerCase()
            .includes(search) ||
          String(expense.内容)
            .toLowerCase()
            .includes(search);

        return (
          monthMatch &&
          categoryMatch &&
          searchMatch
        );
      });


    // 按日期倒序
    filtered.sort(
      (a, b) =>
        new Date(b.日付) -
        new Date(a.日付)
    );


    if (filtered.length === 0) {

      container.innerHTML = `
        <div class="empty">
          这个筛选条件下没有支出记录。
        </div>
      `;

      return;
    }


    // 按日期分组
    const groups = {};

    filtered.forEach(expense => {

      const key =
        formatDateOnly(expense.日付);

      if (!groups[key]) {
        groups[key] = [];
      }

      groups[key].push(expense);

    });


    container.innerHTML =
      Object.entries(groups)
        .map(([date, items]) => {

          return `
            <div class="expense-group">

              <div class="date-title">
                ${date}
              </div>

              <div class="expense-list">

                ${items.map(renderExpense).join('')}

              </div>

            </div>
          `;

        })
        .join('');
  }


  /*
   * ==============================================
   * Single expense
   * ==============================================
   */

  function renderExpense(expense) {

    const amount =
      formatCurrency(expense.金額);

    const content =
      expense.内容
        ? `・${escapeHtml(expense.内容)}`
        : '';

    return `
      <div
        class="expense-item"
        onclick="editExpense(${expense.rowNumber})"
      >

        <div class="expense-main">

          <div class="expense-store">
            ${escapeHtml(expense.店舗)}
          </div>

          <div class="expense-meta">

            ${escapeHtml(expense.大項目)}
            ·
            ${escapeHtml(expense.中項目)}

            <span class="expense-content">
              ${content}
            </span>

          </div>

        </div>


        <div class="expense-right">

          <div class="expense-amount">
            ${amount}
          </div>

          <div class="expense-payment">
            ${escapeHtml(expense.支払方法)}
          </div>

        </div>

      </div>
    `;
  }


  /*
   * ==============================================
   * Future actions
   * ==============================================
   */

  function addExpense() {

  document.getElementById('expenseModal')
    .classList.add('show');

  document.getElementById('formError')
    .style.display = 'none';

  document.getElementById('formStore').value = '';
  document.getElementById('formAmount').value = '';
  document.getElementById('formContent').value = '';

  setDefaultDate();

  setupFormOptions();

}

function closeExpenseModal() {

  document.getElementById('expenseModal')
    .classList.remove('show');

}

function setDefaultDate() {

  const now = new Date();

  const offset =
    now.getTimezoneOffset();

  const localDate =
    new Date(
      now.getTime() - offset * 60000
    );

  document.getElementById('formDate').value =
    localDate
      .toISOString()
      .slice(0, 16);

}


function setupFormOptions() {

  const payment =
    document.getElementById('formPayment');

  const category =
    document.getElementById('formCategory');


  payment.innerHTML = '';

  category.innerHTML = '';


  (settings.paymentMethods || [])
    .forEach(method => {

      const option =
        document.createElement('option');

      option.value = method;
      option.textContent = method;

      payment.appendChild(option);

    });


  (settings.largeCategories || [])
    .forEach(item => {

      const option =
        document.createElement('option');

      option.value = item;
      option.textContent = item;

      category.appendChild(option);

    });


  updateMiddleCategories();

}


function updateMiddleCategories() {

  const category =
    document.getElementById('formCategory')
      .value;

  const subcategory =
    document.getElementById('formSubcategory');


  subcategory.innerHTML = '';


  const middleCategories =
    settings.middleCategories &&
    settings.middleCategories[category]
      ? settings.middleCategories[category]
      : [];


  middleCategories.forEach(item => {

    const option =
      document.createElement('option');

    option.value = item;
    option.textContent = item;

    subcategory.appendChild(option);

  });

}


async function submitExpense() {

  const saveButton =
    document.getElementById('saveButton');

  const errorBox =
    document.getElementById('formError');


  errorBox.style.display = 'none';

  saveButton.disabled = true;
  saveButton.textContent = '保存中…';


  const data = {

    action: 'add',

    日付:
      document.getElementById('formDate').value,

    店舗:
      document.getElementById('formStore').value
        .trim(),

    金額:
      document.getElementById('formAmount').value,

    支払方法:
      document.getElementById('formPayment').value,

    大項目:
      document.getElementById('formCategory').value,

    中項目:
      document.getElementById('formSubcategory').value,

    内容:
      document.getElementById('formContent').value
        .trim()

  };


  try {

    const response =
      await fetch(API_URL, {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(data)

      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(result.error);
    }


    closeExpenseModal();

    await loadData();


  } catch (error) {

    errorBox.textContent =
      '保存失败：' + error.message;

    errorBox.style.display = 'block';

  }


  saveButton.disabled = false;
  saveButton.textContent = '保存';

}
  
  function editExpense(rowNumber) {

    alert(
      '编辑功能将在下一版加入。\n\nSheet row: ' +
      rowNumber
    );

  }


  /*
   * ==============================================
   * Helpers
   * ==============================================
   */

  function getMonthKey(dateString) {

    const date =
      new Date(dateString);

    if (isNaN(date.getTime())) {
      return '';
    }

    return (
      date.getFullYear() +
      '-' +
      String(date.getMonth() + 1)
        .padStart(2, '0')
    );
  }


  function formatMonth(monthKey) {

    const parts =
      monthKey.split('-');

    return (
      parts[0] +
      '年' +
      Number(parts[1]) +
      '月'
    );
  }


  function formatDateOnly(dateString) {

    const date =
      new Date(dateString);

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return (
      date.getFullYear() +
      '/' +
      String(date.getMonth() + 1)
        .padStart(2, '0') +
      '/' +
      String(date.getDate())
        .padStart(2, '0')
    );
  }


  function formatCurrency(amount) {

    return (
      '¥' +
      Number(amount || 0)
        .toLocaleString('ja-JP')
    );

  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function showError(message) {

    const error =
      document.getElementById('error');

    error.textContent = message;
    error.style.display = 'block';

  }

</script>
<!-- Add Expense Modal -->

<div id="expenseModal" class="modal-overlay">

  <div class="modal">

    <div class="modal-header">
      <div>
        <div class="modal-title">添加支出</div>
        <div class="modal-subtitle">记录一笔新的花销</div>
      </div>

      <button class="modal-close" onclick="closeExpenseModal()">
        ×
      </button>
    </div>


    <div class="form">

      <div class="form-group">
        <label>日付</label>
        <input
          id="formDate"
          class="input"
          type="datetime-local"
        >
      </div>


      <div class="form-group">
        <label>店舗</label>
        <input
          id="formStore"
          class="input"
          type="text"
          placeholder="例如：無印良品"
        >
      </div>


      <div class="form-group">
        <label>金額</label>
        <input
          id="formAmount"
          class="input"
          type="number"
          step="0.01"
          placeholder="0.00"
        >
      </div>


      <div class="form-group">
        <label>支払方法</label>

        <select id="formPayment" class="select">
        </select>
      </div>


      <div class="form-row">

        <div class="form-group">
          <label>大項目</label>

          <select
            id="formCategory"
            class="select"
            onchange="updateMiddleCategories()"
          >
          </select>
        </div>


        <div class="form-group">
          <label>中項目</label>

          <select
            id="formSubcategory"
            class="select"
          >
          </select>
        </div>

      </div>


      <div class="form-group">
        <label>内容</label>

        <input
          id="formContent"
          class="input"
          type="text"
          placeholder="例如：牛乳"
        >
      </div>

    </div>


    <div id="formError" class="form-error"></div>


    <div class="modal-actions">

      <button
        class="cancel-button"
        onclick="closeExpenseModal()"
      >
        取消
      </button>

      <button

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Finance</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #FAF9F6;
      color: #292B2F;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ---------- Layout ---------- */

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 24px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #E98B5C;
      letter-spacing: 0.04em;
    }

    .title {
      margin-top: 5px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .add-button {
      border: none;
      background: #E98B5C;
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 5px 14px rgba(233, 139, 92, 0.18);
    }

    .add-button:hover {
      opacity: 0.9;
    }


    /* ---------- Summary ---------- */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .summary-label {
      color: #74777C;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
    }


    /* ---------- Filters ---------- */

    .filter-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: 180px 180px 1fr;
      gap: 10px;
      box-shadow: 0 2px 12px rgba(41, 43, 47, 0.035);
    }

    .select,
    .input {
      width: 100%;
      border: 1px solid #E7E4DE;
      background: #FFFFFF;
      color: #292B2F;
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
    }

    .select:focus,
    .input:focus {
      border-color: #E98B5C;
    }


    /* ---------- Expense list ---------- */

    .expense-section {
      margin-top: 8px;
    }

    .date-group {
      margin-bottom: 25px;
    }

    .date-title {
      font-size: 13px;
      color: #74777C;
      font-weight: 700;
      margin-bottom: 9px;
      padding-left: 4px;
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .expense-item {
      background: #FFFFFF;
      border-radius: 17px;
      padding: 15px 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(41, 43, 47, 0.035);
      transition: transform 0.12s ease;
    }

    .expense-item:hover {
      transform: translateY(-1px);
    }

    .expense-left {
      min-width: 0;
    }

    .expense-store {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .expense-detail {
      font-size: 12px;
      color: #74777C;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 600px;
    }

    .expense-right {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-left: 15px;
    }

    .expense-amount {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .edit-button {
      border: none;
      background: #F4F2ED;
      color: #74777C;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
    }

    .edit-button:hover {
      background: #EEEAE3;
    }

    .empty {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 50px 20px;
      text-align: center;
      color: #74777C;
      font-size: 13px;
    }


    /* ---------- Loading ---------- */

    .loading {
      text-align: center;
      color: #74777C;
      padding: 40px;
      font-size: 13px;
    }

    .error {
      background: #FFF1EF;
      color: #B9554D;
      padding: 13px 15px;
      border-radius: 13px;
      margin-bottom: 20px;
      font-size: 13px;
    }


    /* ---------- Modal ---------- */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(41, 43, 47, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 18px 50px rgba(41, 43, 47, 0.16);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 700;
    }

    .modal-subtitle {
      margin-top: 5px;
      color: #74777C;
      font-size: 12px;
    }

    .modal-close {
      border: none;
      background: #F4F2ED;
      color: #74777C;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 23px;
      line-height: 1;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      color: #74777C;
      font-size: 12px;
      font-weight: 600;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-error {
      display: none;
      margin-top: 15px;
      padding: 11px 13px;
      border-radius: 12px;
      background: #FFF1EF;
      color: #B9554D;
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .modal-actions-right {
      display: flex;
      gap: 10px;
    }

    .delete-button {
      border: none;
      background: #FFF1EF;
      color: #B9554D;
      border-radius: 13px;
      padding: 11px 17px;
      font-weight: 600;
    }

    .cancel-button,
    .save-button {
      border: none;
      border-radius: 13px;
      padding: 11px 20px;
      font-weight: 600;
    }

    .cancel-button {
      background: #F4F2ED;
      color: #74777C;
    }

    .save-button {
      background: #E98B5C;
      color: white;
      min-width: 85px;
    }

    .save-button:disabled,
    .delete-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* ---------- Mobile ---------- */

    @media (max-width: 760px) {

      .page {
        padding: 24px 15px 45px;
      }

      .header {
        align-items: flex-start;
      }

      .title {
        font-size: 25px;
      }

      .add-button {
        padding: 10px 13px;
        font-size: 12px;
      }

      .summary-grid {
        gap: 8px;
      }

      .summary-card {
        padding: 14px;
        border-radius: 16px;
      }

      .summary-label {
        font-size: 10px;
      }

      .summary-value {
        font-size: 18px;
      }

      .filter-card {
        grid-template-columns: 1fr 1fr;
      }

      .filter-card .search-input {
        grid-column: 1 / -1;
      }

      .expense-item {
        padding: 13px 14px;
      }

      .expense-detail {
        max-width: 210px;
      }

      .expense-right {
        gap: 7px;
        margin-left: 8px;
      }

      .expense-amount {
        font-size: 14px;
      }

      .edit-button {
        padding: 7px 8px;
      }

      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        max-height: 92vh;
        border-radius: 24px 24px 0 0;
        padding: 22px 18px 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <!-- Header -->

  <div class="header">

    <div>
      <div class="brand">MY FINANCE</div>
      <div class="title">花销明细</div>
    </div>

    <button
      class="add-button"
      onclick="addExpense()"
    >
      ＋ 添加支出
    </button>

  </div>


  <!-- Error -->

  <div
    id="pageError"
    class="error"
    style="display:none;"
  ></div>


  <!-- Summary -->

  <div class="summary-grid">

    <div class="summary-card">

      <div class="summary-label">
        本月支出
      </div>

      <div
        id="monthlyAmount"
        class="summary-value"
      >
        ¥0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        本月笔数
      </div>

      <div
        id="monthlyCount"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        全部记录
      </div>

      <div
        id="totalCount"
        class="summary-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- Filters -->

  <div class="filter-card">

    <select
      id="monthFilter"
      class="select"
      onchange="applyFilters()"
    >
      <option value="">全部月份</option>
    </select>


    <select
      id="categoryFilter"
      class="select"
      onchange="applyFilters()"
    >
      <option value="">全部大項目</option>
    </select>


    <input
      id="searchInput"
      class="input search-input"
      type="text"
      placeholder="搜索店舗 / 内容"
      oninput="applyFilters()"
    >

  </div>


  <!-- Expenses -->

  <div id="expenseContainer">

    <div class="loading">
      读取中…
    </div>

  </div>

</div>



<!-- Add / Edit Modal -->

<div
  id="expenseModal"
  class="modal-overlay"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <div
          id="modalTitle"
          class="modal-title"
        >
          添加支出
        </div>

        <div
          id="modalSubtitle"
          class="modal-subtitle"
        >
          记录一笔新的花销
        </div>

      </div>


      <button
        class="modal-close"
        onclick="closeExpenseModal()"
      >
        ×
      </button>

    </div>


    <div class="form">

      <div class="form-group">

        <label>日付</label>

        <input
          id="formDate"
          class="input"
          type="datetime-local"
        >

      </div>


      <div class="form-group">

        <label>店舗</label>

        <input
          id="formStore"
          class="input"
          type="text"
          placeholder="例如：無印良品"
        >

      </div>


      <div class="form-group">

        <label>金額</label>

        <input
          id="formAmount"
          class="input"
          type="number"
          step="0.01"
          placeholder="0.00"
        >

      </div>


      <div class="form-group">

        <label>支払方法</label>

        <select
          id="formPayment"
          class="select"
        >
        </select>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>大項目</label>

          <select
            id="formCategory"
            class="select"
            onchange="updateMiddleCategories()"
          >
          </select>

        </div>


        <div class="form-group">

          <label>中項目</label>

          <select
            id="formSubcategory"
            class="select"
          >
          </select>

        </div>

      </div>


      <div class="form-group">

        <label>内容</label>

        <input
          id="formContent"
          class="input"
          type="text"
          placeholder="例如：牛乳"
        >

      </div>

    </div>


    <div
      id="formError"
      class="form-error"
    ></div>


    <div class="modal-actions">

      <button
        id="deleteButton"
        class="delete-button"
        onclick="deleteCurrentExpense()"
        style="display:none;"
      >
        删除
      </button>


      <div class="modal-actions-right">

        <button
          class="cancel-button"
          onclick="closeExpenseModal()"
        >
          取消
        </button>


        <button
          id="saveButton"
          class="save-button"
          onclick="submitExpense()"
        >
          保存
        </button>

      </div>

    </div>

  </div>

</div>



<script>


/* =====================================================
   CONFIG
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxb--pgAmPuBxtOUt2N7PTsU4C5D8-i7DhvXbcmL69OLRCNHiTDPyjU7ZmuV5loMZwfYA/exec';



/* =====================================================
   GLOBAL DATA
   ===================================================== */

let expenses = [];

let settings = {
  paymentMethods: [],
  largeCategories: [],
  middleCategories: {},
  rules: []
};

let editingRowNumber = null;



/* =====================================================
   INITIAL LOAD
   ===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  loadData
);



/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadData() {

  try {

    const response =
      await fetch(
        API_URL + '?action=all'
      );

    const data =
      await response.json();


    if (!data.success) {
      throw new Error(
        data.error || '读取数据失败'
      );
    }


    expenses =
      data.expenses || [];


    settings =
      data.settings || settings;


    setupFilters();

    updateSummary();

    applyFilters();


    hidePageError();


  } catch (error) {

    showPageError(
      '读取数据失败：' + error.message
    );

  }

}



/* =====================================================
   FILTERS
   ===================================================== */

function setupFilters() {

  const monthFilter =
    document.getElementById(
      'monthFilter'
    );

  const categoryFilter =
    document.getElementById(
      'categoryFilter'
    );


  monthFilter.innerHTML =
    '<option value="">全部月份</option>';

  categoryFilter.innerHTML =
    '<option value="">全部大項目</option>';


  const months =
    [...new Set(
      expenses
        .map(e => getMonth(e['日付']))
        .filter(Boolean)
    )]
    .sort()
    .reverse();


  months.forEach(month => {

    const option =
      document.createElement('option');

    option.value = month;

    option.textContent =
      month.replace('-', '年') + '月';

    monthFilter.appendChild(option);

  });


  (settings.largeCategories || [])
    .forEach(category => {

      const option =
        document.createElement('option');

      option.value = category;

      option.textContent = category;

      categoryFilter.appendChild(option);

    });

}



/* =====================================================
   APPLY FILTERS
   ===================================================== */

function applyFilters() {

  const month =
    document.getElementById(
      'monthFilter'
    ).value;


  const category =
    document.getElementById(
      'categoryFilter'
    ).value;


  const search =
    document.getElementById(
      'searchInput'
    ).value
      .trim()
      .toLowerCase();


  const filtered =
    expenses.filter(expense => {

      const expenseMonth =
        getMonth(expense['日付']);


      const monthOK =
        !month ||
        expenseMonth === month;


      const categoryOK =
        !category ||
        expense['大項目'] === category;


      const searchText =
        (
          (expense['店舗'] || '') +
          ' ' +
          (expense['内容'] || '')
        ).toLowerCase();


      const searchOK =
        !search ||
        searchText.includes(search);


      return (
        monthOK &&
        categoryOK &&
        searchOK
      );

    });


  renderExpenses(filtered);

}



/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary() {

  const now =
    new Date();

  const currentMonth =
    now.getFullYear() +
    '-' +
    String(
      now.getMonth() + 1
    ).padStart(2, '0');


  const monthly =
    expenses.filter(
      expense =>
        getMonth(expense['日付']) ===
        currentMonth &&
        Number(expense['計算対象']) === 1
    );


  const monthlyAmount =
    monthly.reduce(
      (sum, expense) =>
        sum + Number(expense['金額'] || 0),
      0
    );


  document.getElementById(
    'monthlyAmount'
  ).textContent =
    formatCurrency(monthlyAmount);


  document.getElementById(
    'monthlyCount'
  ).textContent =
    monthly.length;


  document.getElementById(
    'totalCount'
  ).textContent =
    expenses.length;

}



/* =====================================================
   RENDER EXPENSES
   ===================================================== */

function renderExpenses(list) {

  const container =
    document.getElementById(
      'expenseContainer'
    );


  if (!list.length) {

    container.innerHTML = `
      <div class="empty">
        没有找到符合条件的记录
      </div>
    `;

    return;

  }


  const sorted =
    [...list].sort(
      (a, b) =>
        new Date(b['日付']) -
        new Date(a['日付'])
    );


  const groups = {};


  sorted.forEach(expense => {

    const date =
      getDateOnly(
        expense['日付']
      );


    if (!groups[date]) {
      groups[date] = [];
    }


    groups[date].push(expense);

  });


  container.innerHTML = '';


  Object.keys(groups)
    .forEach(date => {

      const group =
        document.createElement('div');

      group.className =
        'date-group';


      const title =
        document.createElement('div');

      title.className =
        'date-title';

      title.textContent =
        formatDateTitle(date);


      const listElement =
        document.createElement('div');

      listElement.className =
        'expense-list';


      groups[date]
        .forEach(expense => {

          const item =
            document.createElement('div');

          item.className =
            'expense-item';


          const left =
            document.createElement('div');

          left.className =
            'expense-left';


          const store =
            document.createElement('div');

          store.className =
            'expense-store';

          store.textContent =
            expense['店舗'] ||
            '（店舗未入力）';


          const detail =
            document.createElement('div');

          detail.className =
            'expense-detail';


          detail.textContent =
            [
              formatTime(expense['日付']),
              expense['大項目'],
              expense['中項目'],
              expense['内容']
            ]
            .filter(Boolean)
            .join(' · ');


          left.appendChild(store);

          left.appendChild(detail);


          const right =
            document.createElement('div');

          right.className =
            'expense-right';


          const amount =
            document.createElement('div');

          amount.className =
            'expense-amount';

          amount.textContent =
            formatCurrency(
              expense['金額']
            );


          const edit =
            document.createElement('button');

          edit.className =
            'edit-button';

          edit.textContent =
            '编辑';

          edit.onclick =
            () =>
              editExpense(
                expense
              );


          right.appendChild(amount);

          right.appendChild(edit);


          item.appendChild(left);

          item.appendChild(right);


          listElement.appendChild(item);

        });


      group.appendChild(title);

      group.appendChild(listElement);

      container.appendChild(group);

    });

}



/* =====================================================
   ADD EXPENSE
   ===================================================== */

function addExpense() {

  editingRowNumber = null;


  document.getElementById(
    'modalTitle'
  ).textContent =
    '添加支出';


  document.getElementById(
    'modalSubtitle'
  ).textContent =
    '记录一笔新的花销';


  document.getElementById(
    'deleteButton'
  ).style.display =
    'none';


  document.getElementById(
    'formError'
  ).style.display =
    'none';


  document.getElementById(
    'formStore'
  ).value = '';


  document.getElementById(
    'formAmount'
  ).value = '';


  document.getElementById(
    'formContent'
  ).value = '';


  setDefaultDate();

  setupFormOptions();


  document.getElementById(
    'expenseModal'
  ).classList.add('show');

}



/* =====================================================
   EDIT EXPENSE
   ===================================================== */

function editExpense(expense) {

  editingRowNumber =
    expense.rowNumber;


  document.getElementById(
    'modalTitle'
  ).textContent =
    '编辑支出';


  document.getElementById(
    'modalSubtitle'
  ).textContent =
    '修改这笔花销';


  document.getElementById(
    'deleteButton'
  ).style.display =
    'block';


  document.getElementById(
    'formError'
  ).style.display =
    'none';


  setupFormOptions();


  document.getElementById(
    'formDate'
  ).value =
    convertToDatetimeLocal(
      expense['日付']
    );


  document.getElementById(
    'formStore'
  ).value =
    expense['店舗'] || '';


  document.getElementById(
    'formAmount'
  ).value =
    expense['金額'] || '';


  document.getElementById(
    'formPayment'
  ).value =
    expense['支払方法'] || '';


  document.getElementById(
    'formCategory'
  ).value =
    expense['大項目'] || '';


  updateMiddleCategories();


  document.getElementById(
    'formSubcategory'
  ).value =
    expense['中項目'] || '';


  document.getElementById(
    'formContent'
  ).value =
    expense['内容'] || '';


  document.getElementById(
    'expenseModal'
  ).classList.add('show');

}



/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeExpenseModal() {

  document.getElementById(
    'expenseModal'
  ).classList.remove('show');

}



/* =====================================================
   FORM OPTIONS
   ===================================================== */

function setupFormOptions() {

  const payment =
    document.getElementById(
      'formPayment'
    );

  const category =
    document.getElementById(
      'formCategory'
    );


  payment.innerHTML = '';

  category.innerHTML = '';


  (settings.paymentMethods || [])
    .forEach(method => {

      const option =
        document.createElement(
          'option'
        );

      option.value = method;

      option.textContent =
        method;

      payment.appendChild(option);

    });


  (settings.largeCategories || [])
    .forEach(categoryName => {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        categoryName;

      option.textContent =
        categoryName;

      category.appendChild(option);

    });


  updateMiddleCategories();

}



/* =====================================================
   MIDDLE CATEGORIES
   ===================================================== */

function updateMiddleCategories() {

  const category =
    document.getElementById(
      'formCategory'
    ).value;


  const subcategory =
    document.getElementById(
      'formSubcategory'
    );


  subcategory.innerHTML = '';


  const middleCategories =
    settings.middleCategories &&
    settings.middleCategories[category]
      ? settings.middleCategories[category]
      : [];


  middleCategories.forEach(item => {

    const option =
      document.createElement(
        'option'
      );

    option.value = item;

    option.textContent = item;

    subcategory.appendChild(option);

  });

}



/* =====================================================
   SUBMIT ADD / UPDATE
   ===================================================== */

async function submitExpense() {

  const saveButton =
    document.getElementById(
      'saveButton'
    );


  const errorBox =
    document.getElementById(
      'formError'
    );


  errorBox.style.display =
    'none';


  const date =
    document.getElementById(
      'formDate'
    ).value;


  const store =
    document.getElementById(
      'formStore'
    ).value.trim();


  const amount =
    document.getElementById(
      'formAmount'
    ).value;


  const payment =
    document.getElementById(
      'formPayment'
    ).value;


  const category =
    document.getElementById(
      'formCategory'
    ).value;


  const subcategory =
    document.getElementById(
      'formSubcategory'
    ).value;


  const content =
    document.getElementById(
      'formContent'
    ).value.trim();


  if (!date) {
    showFormError(
      '请输入日付。'
    );
    return;
  }


  if (!amount || Number(amount) < 0) {
    showFormError(
      '请输入正确的金额。'
    );
    return;
  }


  if (!payment) {
    showFormError(
      '请选择支払方法。'
    );
    return;
  }


  if (!category) {
    showFormError(
      '请选择大項目。'
    );
    return;
  }


  if (!subcategory) {
    showFormError(
      '请选择中項目。'
    );
    return;
  }


  const data = {

    action:
      editingRowNumber
        ? 'update'
        : 'add',

    日付:
      date,

    店舗:
      store,

    金額:
      amount,

    支払方法:
      payment,

    大項目:
      category,

    中項目:
      subcategory,

    内容:
      content

  };


  if (editingRowNumber) {

    data.rowNumber =
      editingRowNumber;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    '保存中…';


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(data)
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        '保存失败'
      );

    }


    closeExpenseModal();


    await loadData();


  } catch (error) {

    showFormError(
      '保存失败：' +
      error.message
    );

  }


  saveButton.disabled =
    false;

  saveButton.textContent =
    '保存';

}



/* =====================================================
   DELETE
   ===================================================== */

async function deleteCurrentExpense() {

  if (!editingRowNumber) {
    return;
  }


  const confirmed =
    confirm(
      '确定要删除这笔支出吗？\n\n删除后无法恢复。'
    );


  if (!confirmed) {
    return;
  }


  const deleteButton =
    document.getElementById(
      'deleteButton'
    );


  const errorBox =
    document.getElementById(
      'formError'
    );


  errorBox.style.display =
    'none';


  deleteButton.disabled =
    true;

  deleteButton.textContent =
    '删除中…';


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify({

              action: 'delete',

              rowNumber:
                editingRowNumber

            })

          }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        '删除失败'
      );

    }


    closeExpenseModal();


    await loadData();


  } catch (error) {

    showFormError(
      '删除失败：' +
      error.message
    );

  }


  deleteButton.disabled =
    false;

  deleteButton.textContent =
    '删除';

}



/* =====================================================
   DATE HELPERS
   ===================================================== */

function setDefaultDate() {

  const now =
    new Date();


  const offset =
    now.getTimezoneOffset();


  const localDate =
    new Date(
      now.getTime() -
      offset * 60000
    );


  document.getElementById(
    'formDate'
  ).value =
    localDate
      .toISOString()
      .slice(0, 16);

}


function convertToDatetimeLocal(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  const offset =
    date.getTimezoneOffset();


  const localDate =
    new Date(
      date.getTime() -
      offset * 60000
    );


  return localDate
    .toISOString()
    .slice(0, 16);

}


function getMonth(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  return (
    date.getFullYear() +
    '-' +
    String(
      date.getMonth() + 1
    ).padStart(2, '0')
  );

}


function getDateOnly(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  return (
    date.getFullYear() +
    '-' +
    String(
      date.getMonth() + 1
    ).padStart(2, '0') +
    '-' +
    String(
      date.getDate()
    ).padStart(2, '0')
  );

}


function formatDateTitle(value) {

  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return value;
  }


  return (
    date.getFullYear() +
    '/' +
    String(
      date.getMonth() + 1
    ).padStart(2, '0') +
    '/' +
    String(
      date.getDate()
    ).padStart(2, '0')
  );

}


function formatTime(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  return (
    String(
      date.getHours()
    ).padStart(2, '0') +
    ':' +
    String(
      date.getMinutes()
    ).padStart(2, '0')
  );

}



/* =====================================================
   FORMAT
   ===================================================== */

function formatCurrency(value) {

  const number =
    Number(value || 0);


  return (
    '¥' +
    number.toLocaleString(
      'ja-JP',
      {
        maximumFractionDigits: 2
      }
    )
  );

}



/* =====================================================
   ERROR
   ===================================================== */

function showFormError(message) {

  const box =
    document.getElementById(
      'formError'
    );


  box.textContent =
    message;

  box.style.display =
    'block';

}


function showPageError(message) {

  const box =
    document.getElementById(
      'pageError'
    );


  box.textContent =
    message;

  box.style.display =
    'block';

}


function hidePageError() {

  document.getElementById(
    'pageError'
  ).style.display =
    'none';

}



/* =====================================================
   CLOSE MODAL WHEN CLICKING BACKDROP
   ===================================================== */

document
  .getElementById('expenseModal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeExpenseModal();

      }

    }
  );


</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Finance</title>
<style>
:root{
  --bg:#FAF9F6;--card:#FFFFFF;--text:#292B2F;--muted:#74777C;
  --orange:#E98B5C;--yellow:#F4C95D;--blue:#8FAFC0;--rose:#E98278;
  --green:#35A878;--line:#ECEAE5;--shadow:0 8px 28px rgba(41,43,47,.055);
  --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:280px;padding:22px 20px 24px;border-right:1px solid #eeeae4;background:#fffdf9;position:fixed;left:0;top:0;bottom:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 24px;font-size:23px;font-weight:650;letter-spacing:-.5px}
.sun{width:28px;height:28px;display:grid;place-items:center;color:var(--yellow);font-size:27px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;color:var(--text);height:48px;border-radius:14px;text-align:left;padding:0 13px;font-size:16px;display:flex;align-items:center;gap:14px}
.nav button.active{background:#FFF7EC;box-shadow:inset 3px 0 0 var(--orange)}
.nav-icon{width:24px;text-align:center;font-size:20px}
.quick-title{margin:27px 4px 12px;font-size:13px;color:#888b8f}
.quick{display:flex;flex-direction:column;gap:10px}
.quick button{height:64px;border:0;border-radius:16px;text-align:left;padding:0 15px;display:flex;align-items:center;gap:12px;font-size:15px}
.quick button.voice{background:#FFF0E8;color:#D9774B}
.quick button.receipt{background:#FFF6DF;color:#8E7130}
.quick button.manual{background:#EAF5F9;color:#537D91}
.quick-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.65);font-size:17px}
.main{margin-left:280px;width:calc(100% - 280px);padding:10px 30px 38px}
.topbar{height:50px;display:flex;justify-content:flex-end;align-items:center;gap:14px}
.search{width:300px;height:40px;border:1px solid #E9E7E2;background:#fff;border-radius:22px;padding:0 16px;display:flex;align-items:center;gap:8px;color:#aaa}
.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}
.bell,.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.avatar{font-size:19px}
.page{max-width:1480px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.7px}
.year-select{border:0;background:transparent;font-size:20px;font-weight:600;color:var(--text);outline:0;padding:5px 26px 5px 0}
.head-actions{display:flex;align-items:center;gap:10px}
.add-btn{border:0;background:var(--orange);color:#fff;border-radius:13px;padding:11px 18px;font-weight:600;box-shadow:0 6px 14px rgba(233,139,92,.22)}
.overview-head{display:flex;justify-content:space-between;align-items:center;margin:3px 4px 18px}
.overview-year{font-size:20px;font-weight:650}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:28px;margin-bottom:18px}
.hero{height:276px;border-radius:22px;position:relative;overflow:hidden;padding:28px 34px;background:linear-gradient(125deg,#fff8ed,#fffdf9 54%,#fff3dc);box-shadow:var(--shadow);border:1px solid rgba(238,232,223,.75)}
.hero:before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;right:-45px;bottom:-120px;background:rgba(244,201,93,.35)}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:75px;bottom:-110px;background:rgba(233,139,92,.22)}
.hero .eyebrow{font-size:15px;color:#73777b;margin-bottom:8px}
.hero-amount{font-size:53px;line-height:1.05;font-weight:720;letter-spacing:-2px;margin:4px 0 15px}
.hero-sub{font-size:15px;color:#6e7176}
.hero-change{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:15px}
.hero-change strong{font-size:20px;color:var(--green)}
.hero-note{position:absolute;right:110px;top:72px;z-index:2;font-family:"STKaiti","KaiTi","PingFang SC",cursive;font-size:21px;line-height:1.65;transform:rotate(-6deg);color:#55514a}
.hero-smile{position:absolute;right:125px;top:130px;font-size:25px;z-index:2}
.ai-card{min-height:276px;background:#fff;border:1px solid #eeeae4;border-radius:22px;padding:25px 25px 20px;box-shadow:var(--shadow)}
.card-title{font-size:19px;font-weight:680;display:flex;align-items:center;justify-content:space-between}
.card-title small{font-size:13px;color:#83A9B8;font-weight:600}
.ai-title{display:flex;align-items:center;gap:9px}
.ai-spark{font-size:23px}
.ai-text{font-size:14px;line-height:1.75;color:#60646a;margin:13px 0 15px}
.ai-insights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.insight{border-radius:14px;padding:12px 10px;min-height:74px}
.insight.orange{background:#FFF3EC}.insight.blue{background:#EEF6F8}.insight.yellow{background:#FFF8E7}
.insight-label{font-size:12px;color:#777;margin-bottom:5px}.insight-value{font-size:16px;font-weight:700}.orange .insight-value{color:#D9774B}.blue .insight-value{color:#5D93A7}
.overview-lower{display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);gap:28px}
.card{background:#fff;border:1px solid #eeeae4;border-radius:22px;box-shadow:var(--shadow)}
.structure{padding:22px 25px}
.structure-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center;margin-top:15px}
.donut-wrap{height:220px;display:grid;place-items:center;position:relative}
.donut{width:205px;height:205px;border-radius:50%;position:relative;background:#e6e6e6}
.donut-hole{position:absolute;inset:49px;border-radius:50%;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center}
.donut-total{font-size:18px;font-weight:700}.donut-label{font-size:12px;color:#8a8d91;margin-top:3px}
.structure-list{display:flex;flex-direction:column;gap:12px}
.structure-row{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;font-size:14px}
.dot{width:11px;height:11px;border-radius:50%}.structure-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.structure-val{color:#777;font-size:13px}
.trend{padding:22px 25px 17px;min-width:0}
.chart-wrap{height:235px;margin-top:13px;position:relative;overflow:hidden}
.chart-svg{width:100%;height:100%;display:block;overflow:visible}
.chart-tooltip{position:absolute;pointer-events:none;background:#fff;border:1px solid #e9e6df;border-radius:10px;padding:8px 10px;box-shadow:0 7px 20px rgba(0,0,0,.09);font-size:12px;white-space:nowrap;display:none;z-index:3}
.chart-tooltip strong{font-size:14px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:#777}
.chart-legend{margin-left:auto;margin-top:0;font-weight:500}
.legend-item{display:flex;gap:6px;align-items:center}.legend-line{width:18px;height:3px;border-radius:2px}
.below-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:28px;margin-top:28px}
.below-grid .rank-card{margin-top:0}
.focus-card{padding:22px 25px;min-height:150px}
.focus-text{font-size:14px;line-height:1.75;color:#62666b;margin:13px 0 12px}
.focus-items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.focus-item{border-radius:13px;background:#FAF7F1;padding:10px 11px}
.focus-item .label{font-size:11px;color:#85888c}
.focus-item .value{font-size:14px;font-weight:700;margin-top:4px}

.rank-card{margin-top:28px;padding:22px 25px}
.store-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.store-item{background:#FAF9F6;border-radius:14px;padding:13px 15px;min-height:74px}
.store-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.store-name{font-size:14px;font-weight:620;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.store-count{font-size:16px;font-weight:700;white-space:nowrap}
.store-amount{font-size:13px;color:#777;margin-top:7px}
.details-card{padding:20px 22px}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filter-select,.filter-input{height:40px;border:1px solid #E7E4DE;background:#fff;border-radius:11px;padding:0 12px;outline:0;color:var(--text)}
.filter-input{min-width:230px}.filter-select:focus,.filter-input:focus{border-color:#d9b79e}
.detail-year{margin-left:auto}
.month-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-bottom:18px}
.month-tabs button{border:0;background:#F4F2EE;color:#70747a;border-radius:10px;padding:8px 13px;white-space:nowrap}
.month-tabs button.active{background:#FFF0E7;color:#C96F46;font-weight:650}
.day-group{margin-bottom:19px}.day-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#81858a;margin:0 4px 8px}
.expense-row{display:grid;grid-template-columns:72px minmax(0,1fr) 110px 135px 88px;align-items:center;gap:12px;padding:14px 12px;border-top:1px solid #f0eee9}
.expense-row:hover{background:#FCFBF8}.date-time{font-size:13px;color:#85888c}.expense-main{min-width:0}.merchant{font-size:15px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{font-size:12px;color:#85888c;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.expense-amount{text-align:right;font-weight:680}.expense-cat{font-size:12px;color:#74777c;text-align:center}.row-actions{display:flex;justify-content:flex-end;gap:6px}.icon-btn{width:34px;height:34px;border:0;background:#F6F4F0;border-radius:9px;color:#666}.icon-btn:hover{background:#EEEAE3}
.empty{padding:70px 20px;text-align:center;color:#96999d}
.modal-backdrop{position:fixed;inset:0;background:rgba(41,43,47,.25);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.show{display:flex}
.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.16);padding:25px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-title{font-size:20px;font-weight:700}.close{border:0;background:#F5F3EF;border-radius:50%;width:34px;height:34px}
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#F7F5F1;padding:4px;border-radius:12px;margin-bottom:20px}
.mode-tabs button{border:0;background:transparent;border-radius:9px;padding:9px;color:#777}.mode-tabs button.active{background:#fff;color:#C96F46;box-shadow:0 2px 7px rgba(0,0,0,.06);font-weight:650}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#686c71}.field input,.field select{height:43px;border:1px solid #E5E2DC;border-radius:11px;padding:0 12px;background:#fff;outline:0;color:var(--text);width:100%}.field input:focus,.field select:focus{border-color:#DFA37F;box-shadow:0 0 0 3px rgba(233,139,92,.08)}
.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.danger{border:0;background:#FFF0EF;color:#C96359;border-radius:10px;padding:10px 14px}.save{border:0;background:var(--orange);color:#fff;border-radius:11px;padding:11px 22px;font-weight:650}
.status{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#292B2F;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.status.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:80px 20px;text-align:center;color:#888}
@media(max-width:1100px){
  .sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding-left:20px;padding-right:20px}
  .overview-grid,.overview-lower,.below-grid{grid-template-columns:1fr}.hero{height:250px}.ai-card{min-height:250px}.structure-body{grid-template-columns:210px 1fr}
}
@media(max-width:760px){
  .sidebar{display:none}.main{margin-left:0;width:100%;padding:8px 14px 80px}.topbar{height:45px}.search{width:200px}.overview-head{margin-top:6px}.overview-grid{gap:14px}.hero{padding:23px 22px;height:225px}.hero-amount{font-size:40px}.hero-note,.hero-smile{display:none}.overview-lower{gap:14px}.structure-body{grid-template-columns:1fr}.donut-wrap{height:190px}.donut{width:175px;height:175px}.donut-hole{inset:42px}.trend{padding:19px 15px 14px}.chart-wrap{height:220px}.store-list{grid-template-columns:1fr 1fr}.expense-row{grid-template-columns:54px minmax(0,1fr) 85px 76px}.expense-cat{display:none}.detail-year{margin-left:0}.details-card{padding:15px}.filters{align-items:stretch}.filter-input{min-width:0;flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom-nav{display:flex!important}
}
.bottom-nav{display:none;position:fixed;left:10px;right:10px;bottom:10px;height:62px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid #eeeae4;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.10);z-index:30;align-items:center;justify-content:space-around}.bottom-nav button{border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.bottom-nav button.active{color:#C96F46;font-weight:650}.bottom-add{width:44px;height:44px;border-radius:50%;border:0;background:var(--orange)!important;color:#fff!important;font-size:21px!important}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="sun">☀</span><span>My Finance</span></div>
    <nav class="nav">
      <button id="navOverview" class="active"><span class="nav-icon">⌂</span>全年纵览</button>
      <button id="navDetails"><span class="nav-icon">☷</span>花销明细</button>
    </nav>
    <div class="quick-title">快捷入口</div>
    <div class="quick">
      <button class="voice" onclick="openExpenseModal('voice')"><span class="quick-icon">♩</span>语音记账</button>
      <button class="receipt" onclick="openExpenseModal('receipt')"><span class="quick-icon">▣</span>拍小票</button>
      <button class="manual" onclick="openExpenseModal('manual')"><span class="quick-icon">✎</span>手动输入</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"></div>

    <section id="overviewPage" class="page">
      <div class="overview-head">
        <select id="overviewYear" class="year-select"></select>
        <button class="add-btn" onclick="openExpenseModal('manual')">＋ 添加花销</button>
      </div>

      <div class="overview-grid">
        <div class="hero">
          <div class="eyebrow" id="heroYear">2026</div>
          <div class="hero-amount" id="heroAmount">¥ 0</div>
          <div class="hero-sub">今年累计支出</div>
          <div class="hero-change"><strong id="heroChange">—</strong><span>较去年同期</span></div>
          <div class="hero-note">每一笔花销<br>都是生活的注脚</div><div class="hero-smile">☺</div>
        </div>
        <div class="ai-card">
          <div class="card-title"><div class="ai-title"><span class="ai-spark">✦</span>AI 年度总结</div><small>查看详情 ›</small></div>
          <div id="aiText" class="ai-text">正在根据你的年度花销整理总结……</div>
          <div class="ai-insights">
            <div class="insight orange"><div class="insight-label">旅行支出</div><div class="insight-value" id="travelInsight">—</div></div>
            <div class="insight blue"><div class="insight-label">日用品支出</div><div class="insight-value" id="dailyInsight">—</div></div>
            <div class="insight yellow"><div class="insight-label">建议</div><div class="insight-value" id="adviceInsight">—</div></div>
          </div>
        </div>
      </div>

      <div class="overview-lower">
        <div class="card structure">
          <div class="card-title"><span>消费结构</span><small>查看详情 ›</small></div>
          <div class="structure-body">
            <div class="donut-wrap"><div id="donut" class="donut"><div class="donut-hole"><div id="donutTotal" class="donut-total">¥0</div><div class="donut-label">总支出</div></div></div></div>
            <div id="structureList" class="structure-list"></div>
          </div>
        </div>
        <div class="card trend">
          <div class="card-title"><span>月度支出趋势</span><div id="chartLegend" class="legend chart-legend"></div></div>
          <div id="chartWrap" class="chart-wrap"><svg id="trendSvg" class="chart-svg" viewBox="0 0 800 235" preserveAspectRatio="none"></svg><div id="chartTooltip" class="chart-tooltip"></div></div>
        </div>
      </div>

      <div class="below-grid">
        <div class="card rank-card">
          <div class="card-title"><span>常去的店铺</span></div>
          <div id="storeList" class="store-list"></div>
        </div>
        <div class="card focus-card">
          <div class="card-title"><div class="ai-title"><span class="ai-spark">✦</span>今年值得关注的消费</div><small>AI 分析</small></div>
          <div id="focusText" class="focus-text">正在分析今年的消费结构……</div>
          <div id="focusItems" class="focus-items"></div>
        </div>
      </div>
    </section>

    <section id="detailsPage" class="page" style="display:none">
      <div class="page-head">
        <div class="page-title">花销明细</div>
        <div class="head-actions"><select id="detailYear" class="year-select"></select><button class="add-btn" onclick="openExpenseModal('manual')">＋ 添加花销</button></div>
      </div>
      <div class="card details-card">
        <div class="filters">
          <select id="detailLargeFilter" class="filter-select"><option value="">全部大项目</option></select>
          <input id="detailSearch" class="filter-input" placeholder="搜索店铺、内容..." />
        </div>
        <div id="monthTabs" class="month-tabs"></div>
        <div id="expenseList"></div>
      </div>
    </section>
  </main>
</div>

<div class="bottom-nav">
  <button id="bottomOverview" class="active">⌂<span>全年纵览</span></button>
  <button id="bottomAdd" class="bottom-add" onclick="openExpenseModal('manual')">＋</button>
  <button id="bottomDetails">☷<span>花销明细</span></button>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="backdropClose(event)">
  <div class="modal">
    <div class="modal-head"><div id="modalTitle" class="modal-title">添加花销</div><button class="close" onclick="closeExpenseModal()">×</button></div>
    <div class="mode-tabs">
      <button id="modeVoice" onclick="setEntryMode('voice')">语音记账</button>
      <button id="modeReceipt" onclick="setEntryMode('receipt')">拍小票</button>
      <button id="modeManual" class="active" onclick="setEntryMode('manual')">手动输入</button>
    </div>
    <div class="form-grid">
      <div class="field"><label>日期时间</label><input id="fDate" type="datetime-local"></div>
      <div class="field"><label>店铺</label><input id="fStore" placeholder="例如 无印良品"></div>
      <div class="field"><label>金额（円）</label><input id="fAmount" type="number" step="0.01" min="0" placeholder="0"></div>
      <div class="field"><label>支付方式</label><select id="fPayment"></select></div>
      <div class="field"><label>大项目</label><select id="fLarge"></select></div>
      <div class="field"><label>中项目</label><select id="fMiddle"></select></div>
      <div class="field full"><label>内容</label><input id="fContent" placeholder="例如 沐浴球"></div>
    </div>
    <div class="modal-actions"><button id="deleteBtn" class="danger" style="display:none" onclick="deleteCurrent()">删除记录</button><button class="save" onclick="saveCurrent()">保存</button></div>
  </div>
</div>
<div id="status" class="status"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxb--pgAmPuBxtOUt2N7PTsU4C5D8-i7DhvXbcmL69OLRCNHiTDPyjU7ZmuV5loMZwfYA/exec";

let expenses=[];
let settings={payments:[], larges:[], middleMap:{}, rules:[]};
let selectedOverviewYear=new Date().getFullYear();
let selectedDetailYear=new Date().getFullYear();
let selectedMonth=0;
let editingRow=null;
let entryMode="manual";
let dataReady=false;

const $=id=>document.getElementById(id);
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP",{maximumFractionDigits:2});
const norm=s=>String(s??"").trim();

function showStatus(msg,ms=2200){const el=$("status");el.textContent=msg;el.classList.add("show");clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>el.classList.remove("show"),ms)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function dateValue(v){
  if(v instanceof Date) return v;
  if(typeof v==="number"){const d=new Date(v);return isNaN(d)?null:d}
  let s=norm(v);
  if(!s)return null;
  s=s.replace("T"," ").replace(/\./g,"/");
  let d=new Date(s);
  if(!isNaN(d))return d;
  const m=s.match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return null;
}
function yearOf(e){const d=dateValue(e["日付"]??e.date);return d?d.getFullYear():0}

/* Settings normalizer: accepts object/row-array forms so the page remains compatible
   with the existing Apps Script getSettings()/all response. */
function normalizeSettings(raw){
  const out={payments:[],larges:[],middleMap:{},rules:[]};
  const add=(arr,val)=>{val=norm(val);if(val&&!arr.includes(val))arr.push(val)};
  const putMiddle=(large,middle)=>{large=norm(large);middle=norm(middle);if(!large||!middle)return;if(!out.middleMap[large])out.middleMap[large]=[];if(!out.middleMap[large].includes(middle))out.middleMap[large].push(middle);add(out.larges,large)};

  let data=raw?.settings??raw?.data?.settings??raw;
  if(data && !Array.isArray(data) && typeof data==="object"){
    const p=data.payments??data.paymentMethods??data["支払方法"];
    const l=data.larges??data.largeCategories??data["大項目"];
    const m=data.middleMap??data.middles??data.middleCategories??data["中項目"];
    if(Array.isArray(p))p.forEach(x=>add(out.payments,typeof x==="object"?(x.value??x.name??x["支払方法"]):x));
    if(Array.isArray(l))l.forEach(x=>add(out.larges,typeof x==="object"?(x.value??x.name??x["大項目"]):x));
    if(m && typeof m==="object"&&!Array.isArray(m)){
      Object.entries(m).forEach(([k,v])=>Array.isArray(v)?v.forEach(x=>putMiddle(k,typeof x==="object"?(x.value??x.name??x["中項目"]):x)):putMiddle(k,v));
    }
    const rules=data.rules??data["規則"];
    if(Array.isArray(rules))out.rules=rules;
  }
  const rows = Array.isArray(data)?data:(raw?.rows??raw?.data?.rows);
  if(Array.isArray(rows)){
    rows.forEach(row=>{
      if(Array.isArray(row)){
        // Settings columns: A payment, B large, C middle, D rule.
        add(out.payments,row[0]); putMiddle(row[1],row[2]); if(norm(row[3]))out.rules.push(row[3]);
      }else if(row && typeof row==="object"){
        add(out.payments,row["支払方法"]??row.payment??row.A);
        putMiddle(row["大項目"]??row.large??row.B,row["中項目"]??row.middle??row.C);
        const rule=row["規則"]??row.rule??row.D;if(norm(rule))out.rules.push(rule);
      }
    });
  }
  // Some implementations return separate columns.
  if(raw?.paymentMethods) raw.paymentMethods.forEach(x=>add(out.payments,x));
  if(raw?.largeCategories) raw.largeCategories.forEach(x=>add(out.larges,x));
  if(raw?.middleCategories && typeof raw.middleCategories==="object"){
    Object.entries(raw.middleCategories).forEach(([k,v])=>Array.isArray(v)?v.forEach(x=>putMiddle(k,x)):putMiddle(k,v));
  }
  return out;
}

function normalizeExpenses(raw){
  // 兼容 Apps Script 常见返回：
  // 1. 直接数组
  // 2. {expenses:[...]}
  // 3. {data:[...]}
  // 4. {data:{expenses:[...]}}
  // 5. {rows:[...]} / {data:{rows:[...]}}
  let arr=null;
  if(Array.isArray(raw)) arr=raw;
  else if(Array.isArray(raw?.expenses)) arr=raw.expenses;
  else if(Array.isArray(raw?.data)) arr=raw.data;
  else if(Array.isArray(raw?.rows)) arr=raw.rows;
  else if(Array.isArray(raw?.records)) arr=raw.records;
  else if(Array.isArray(raw?.data?.expenses)) arr=raw.data.expenses;
  else if(Array.isArray(raw?.data?.rows)) arr=raw.data.rows;
  else if(Array.isArray(raw?.data?.records)) arr=raw.data.records;

  if(!Array.isArray(arr)) return [];

  return arr.map((e,i)=>{
    if(Array.isArray(e)){
      return {
        "計算対象":e[0],
        "日付":e[1],
        "店舗":e[2],
        "金額":e[3],
        "支払方法":e[4],
        "大項目":e[5],
        "中項目":e[6],
        "内容":e[7],
        "rowNumber":i+2
      };
    }
    if(e && typeof e==="object"){
      // Apps Script 已经返回 rowNumber 时保留；没有时按数据数组位置推算。
      if(e.rowNumber==null && e["行番号"]==null) e.rowNumber=i+2;
      return e;
    }
    return null;
  }).filter(Boolean);
}

async function init(){
  try{
    // 设置只在页面初次打开时读取一次；花销明细单独读取，避免 all 接口不同返回结构导致记录丢失。
    const [settingsRaw, expensesRaw] = await Promise.all([
      getAPI("settings"),
      getAPI("expenses")
    ]);
    settings=normalizeSettings(settingsRaw);
    expenses=normalizeExpenses(expensesRaw);

    dataReady=true;
    const years=[new Date().getFullYear(),...expenses.map(yearOf)].filter(Boolean).sort((a,b)=>b-a);
    if(years.length)selectedOverviewYear=years[0];
    selectedDetailYear=selectedOverviewYear;
    renderAll();

    if(!expenses.length){
      console.warn("Google Sheets returned no expense rows.", expensesRaw);
    }
  }catch(err){
    console.error("Initial load failed:",err);
    showStatus("读取数据失败："+err.message,5000);
    dataReady=false;
    renderEmptyState("无法读取 Google Sheets 的花销记录，请检查 Apps Script 的 expenses 接口。");
  }
}

function niceMax(n){if(n<=0)return 10000;const p=10**Math.floor(Math.log10(n));const x=n/p;return (x<=1?1:x<=2?2:x<=5?5:10)*p}
function renderTrend(y){
  const wrap=$("chartWrap"),svg=$("trendSvg"),W=800,H=235,left=48,right=16,top=18,bottom=35;

  const max=niceMax(Math.max(...cur,...prev));
  const x=i=>left+(W-left-right)*(i/11), yv=v=>top+(H-top-bottom)*(1-v/max);
  const grid=Array.from({length:5},(_,i)=>{const v=max*i/4;const yy=yv(v);return `<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="#eeeae4" stroke-width="1"/><text x="${left-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#8a8e92">${v>=10000?Math.round(v/1000)+"k":Math.round(v)}</text>`}).join("");
  const line=(arr,dash="")=>arr.map((v,i)=>(i?"L":"M")+x(i)+" "+yv(v)).join(" ");
  const area=`M ${x(0)} ${yv(cur[0])} `+cur.map((v,i)=>(i?"L":"")+" "+x(i)+" "+yv(v)).join(" ")+` L ${x(11)} ${H-bottom} L ${x(0)} ${H-bottom} Z`;

  svg.innerHTML=grid+`<path d="${area}" fill="#F4C95D" opacity=".13"></path><path d="${line(cur)}" fill="none" stroke="#E98B5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="${line(prev)}" fill="none" stroke="#8FAFC0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"></path>`+points(cur,y,"#E98B5C")+points(prev,y-1,"#8FAFC0")+labels;

  wrap.querySelectorAll(".trend-point").forEach(pt=>pt.addEventListener("click",ev=>{
    const el=ev.currentTarget, rect=wrap.getBoundingClientRect(), svgRect=svg.getBoundingClientRect();
    const px=(+el.getAttribute("cx")/W)*svgRect.width+svgRect.left-rect.left;
    const py=(+el.getAttribute("cy")/H)*svgRect.height+svgRect.top-rect.top;

  try{
    showStatus(editingRow?"正在保存修改…":"正在保存…",1200);
    const res=editingRow?await postAPI({action:"update",rowNumber:editingRow,...payload}):await postAPI({action:"add",...payload});
    if(res?.success===false)throw new Error(res.message||"保存失败");
    closeExpenseModal();
    const fresh=await getAPI("expenses");expenses=normalizeExpenses(fresh);
    renderAll();showStatus(editingRow?"修改成功":"添加成功");
  }catch(err){console.error(err);showStatus("保存失败："+err.message,4000)}
}
async function deleteCurrent(){if(editingRow)await deleteByRow(editingRow)}
async function deleteByRow(row){
  const e=expenses.find(x=>Number(x.rowNumber)===Number(row));if(!e)return;
  if(!confirm(`确定删除「${storeOf(e)} ${yen(amountOf(e))}」吗？`))return;
  try{
    const res=await postAPI({action:"delete",rowNumber:Number(row)});
    if(res?.success===false)throw new Error(res.message||"删除失败");
    if(editingRow)closeExpenseModal();
    const fresh=await getAPI("expenses");expenses=normalizeExpenses(fresh);renderAll();showStatus("删除成功");
  }catch(err){console.error(err);showStatus("删除失败："+err.message,4000)}
}

window.addEventListener("resize",()=>{if($("overviewPage").style.display!=="none")renderTrend(selectedOverviewYear)});
init();
</script>

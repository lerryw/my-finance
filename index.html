<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Finance</title>

<style>
:root {
  --bg: #FAF9F6;
  --card: #FFFFFF;
  --text: #292B2F;
  --sub: #74777C;
  --orange: #E98B5C;
  --yellow: #F4C95D;
  --blue: #8FAFC0;
  --rose: #E98278;
  --border: #ECEAE5;
  --shadow: 0 8px 30px rgba(40, 40, 40, 0.06);
  --radius: 20px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Sans",
    "Yu Gothic",
    "Noto Sans JP",
    Arial,
    sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
}

/* =========================
   Sidebar
========================= */

.sidebar {
  width: 220px;
  padding: 30px 20px;
  border-right: 1px solid var(--border);
  background: rgba(255,255,255,0.65);
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
}

.brand {
  padding: 0 10px;
  margin-bottom: 42px;
}

.brand-title {
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -0.5px;
}

.brand-sub {
  margin-top: 5px;
  color: var(--sub);
  font-size: 12px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav button {
  border: none;
  background: transparent;
  color: var(--sub);
  text-align: left;
  padding: 13px 14px;
  border-radius: 13px;
  font-size: 14px;
}

.nav button:hover {
  background: #F3F1ED;
}

.nav button.active {
  background: #FFF1E8;
  color: #C96838;
  font-weight: 650;
}

/* =========================
   Main
========================= */

.main {
  margin-left: 220px;
  width: calc(100% - 220px);
  padding: 28px 36px 60px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.page-title {
  font-size: 27px;
  font-weight: 760;
  letter-spacing: -0.7px;
}

.page-subtitle {
  color: var(--sub);
  font-size: 13px;
  margin-top: 5px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.year-select,
.filter-select,
.search-input {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 11px;
  height: 40px;
  padding: 0 13px;
  outline: none;
}

.search-input {
  width: 210px;
}

.add-btn {
  border: none;
  height: 40px;
  padding: 0 17px;
  border-radius: 11px;
  background: var(--orange);
  color: white;
  font-weight: 650;
  box-shadow: 0 5px 15px rgba(233,139,92,.22);
}

.add-btn:hover {
  opacity: .9;
}

/* =========================
   Common Cards
========================= */

.card {
  background: var(--card);
  border: 1px solid rgba(236,234,229,.8);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 17px;
}

.muted {
  color: var(--sub);
}

/* =========================
   Overview Hero
========================= */

.overview-top {
  display: grid;
  grid-template-columns: 0.85fr 1.35fr;
  gap: 18px;
  margin-bottom: 18px;
}

.hero-card {
  min-height: 190px;
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero-label {
  color: var(--sub);
  font-size: 13px;
}

.hero-total {
  font-size: 37px;
  font-weight: 760;
  letter-spacing: -1px;
  margin-top: 7px;
}

.hero-yen {
  font-size: 18px;
  margin-left: 3px;
  font-weight: 600;
}

.hero-meta {
  display: flex;
  gap: 22px;
  margin-top: 15px;
}

.hero-meta-item {
  font-size: 12px;
  color: var(--sub);
}

.hero-meta-item strong {
  display: block;
  color: var(--text);
  font-size: 16px;
  margin-bottom: 2px;
}

/* AI */

.ai-card {
  min-height: 190px;
  padding: 23px 26px;
}

.ai-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.ai-title {
  font-weight: 720;
  font-size: 16px;
}

.ai-badge {
  background: #FFF3E8;
  color: #C96838;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 11px;
}

.ai-content {
  color: #55585D;
  line-height: 1.75;
  font-size: 13px;
}

/* =========================
   Overview Grid
========================= */

.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.overview-card {
  padding: 23px 25px;
  min-height: 320px;
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 250px;
}

canvas {
  max-width: 100%;
}

/* =========================
   Category Structure
========================= */

.structure-layout {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 20px;
  align-items: center;
}

.donut-wrap {
  width: 165px;
  height: 165px;
  position: relative;
  margin: auto;
}

.donut-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.donut-center-number {
  font-size: 19px;
  font-weight: 730;
}

.donut-center-label {
  color: var(--sub);
  font-size: 10px;
  margin-top: 2px;
}

.category-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.category-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.category-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.category-name {
  color: #505359;
}

.category-value {
  text-align: right;
  font-weight: 650;
}

.category-percent {
  color: var(--sub);
  margin-left: 5px;
}

/* =========================
   Frequent Stores
========================= */

.store-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.store-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) 72px 100px;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #F1EFEA;
}

.store-row:last-child {
  border-bottom: none;
}

.store-name {
  font-size: 13px;
  font-weight: 650;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-count {
  text-align: right;
  font-size: 14px;
  font-weight: 720;
  white-space: nowrap;
}

.store-count span {
  color: var(--sub);
  font-size: 11px;
  font-weight: 500;
  margin-left: 2px;
}

.store-total {
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}

/* =========================
   Details
========================= */

.details-summary {
  display: flex;
  gap: 14px;
  margin-bottom: 17px;
}

.summary-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 14px 18px;
  min-width: 145px;
}

.summary-label {
  font-size: 11px;
  color: var(--sub);
}

.summary-value {
  margin-top: 5px;
  font-size: 19px;
  font-weight: 720;
}

.filters {
  padding: 15px 17px;
  margin-bottom: 18px;
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.expense-group {
  margin-bottom: 22px;
}

.expense-date {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #5C5F64;
}

.expense-item {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 15px 17px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 18px;
  margin-bottom: 8px;
}

.expense-main {
  min-width: 0;
}

.expense-store {
  font-weight: 680;
  font-size: 14px;
}

.expense-content {
  color: var(--sub);
  font-size: 12px;
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-category {
  color: var(--sub);
  font-size: 11px;
  white-space: nowrap;
}

.expense-amount {
  font-size: 15px;
  font-weight: 720;
  white-space: nowrap;
}

.edit-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 9px;
  padding: 7px 10px;
  font-size: 11px;
  color: #5B5E63;
}

.edit-btn:hover {
  background: #F8F7F4;
}

.empty {
  padding: 70px 20px;
  text-align: center;
  color: var(--sub);
  font-size: 13px;
}

/* =========================
   Modal
========================= */

.modal-backdrop {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(30,30,30,.32);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(560px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 23px;
  padding: 25px;
  box-shadow: 0 20px 70px rgba(0,0,0,.18);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-title {
  font-size: 19px;
  font-weight: 740;
}

.close-btn {
  border: none;
  background: #F4F2EE;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: #666;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-label {
  font-size: 11px;
  color: var(--sub);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 11px;
  padding: 10px 11px;
  outline: none;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--orange);
}

.form-textarea {
  min-height: 72px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 23px;
}

.modal-actions-right {
  display: flex;
  gap: 9px;
}

.delete-btn {
  border: none;
  background: transparent;
  color: var(--rose);
  font-size: 12px;
}

.cancel-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 10px 15px;
}

.save-btn {
  border: none;
  background: var(--orange);
  color: #fff;
  border-radius: 10px;
  padding: 10px 17px;
  font-weight: 650;
}

/* =========================
   Loading
========================= */

.loading {
  padding: 70px;
  text-align: center;
  color: var(--sub);
  font-size: 13px;
}

/* =========================
   Mobile
========================= */

.mobile-nav {
  display: none;
}

@media (max-width: 900px) {
  .sidebar {
    display: none;
  }

  .main {
    margin-left: 0;
    width: 100%;
    padding: 20px 16px 90px;
  }

  .overview-top,
  .overview-grid {
    grid-template-columns: 1fr;
  }

  .topbar {
    align-items: flex-start;
    gap: 15px;
  }

  .top-actions {
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .overview-top {
    gap: 12px;
  }

  .hero-card {
    min-height: 165px;
  }

  .ai-card {
    min-height: 200px;
  }

  .mobile-nav {
    position: fixed;
    z-index: 90;
    left: 12px;
    right: 12px;
    bottom: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--border);
    box-shadow: 0 10px 35px rgba(0,0,0,.1);
    border-radius: 18px;
    padding: 7px;
  }

  .mobile-nav button {
    border: none;
    background: transparent;
    padding: 10px 4px;
    border-radius: 12px;
    color: var(--sub);
    font-size: 11px;
  }

  .mobile-nav button.active {
    background: #FFF1E8;
    color: #C96838;
    font-weight: 650;
  }

  .expense-item {
    grid-template-columns: 1fr auto;
  }

  .expense-category {
    display: none;
  }

  .structure-layout {
    grid-template-columns: 145px 1fr;
    gap: 8px;
  }

  .donut-wrap {
    width: 135px;
    height: 135px;
  }

  .store-row {
    grid-template-columns: minmax(0,1fr) 62px 90px;
    gap: 7px;
  }
}

@media (max-width: 600px) {
  .page-title {
    font-size: 23px;
  }

  .topbar {
    display: block;
  }

  .top-actions {
    margin-top: 15px;
    justify-content: flex-start;
  }

  .top-actions .add-btn {
    flex: 1;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  .structure-layout {
    grid-template-columns: 1fr;
  }

  .donut-wrap {
    margin-bottom: 8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">My Finance</div>
      <div class="brand-sub">Personal Finance Workbench</div>
    </div>

    <nav class="nav">
      <button id="navOverview" class="active" onclick="showPage('overview')">
        全年纵览
      </button>

      <button id="navDetails" onclick="showPage('details')">
        花销明细
      </button>
    </nav>
  </aside>

  <main class="main">

    <div class="topbar">

      <div>
        <div class="page-title" id="pageTitle">全年纵览</div>
        <div class="page-subtitle" id="pageSubtitle">
          看见你的钱都花在哪里
        </div>
      </div>

      <div class="top-actions">

        <select
          id="overviewYear"
          class="year-select"
          onchange="changeOverviewYear()">
        </select>

        <button class="add-btn" onclick="openAddModal()">
          ＋ 添加花销
        </button>

      </div>

    </div>

    <!-- =========================
         Overview
    ========================== -->

    <section id="overviewPage">

      <div class="overview-top">

        <div class="card hero-card">

          <div class="hero-label">年度总支出</div>

          <div class="hero-total">
            <span id="annualTotal">¥0</span>
          </div>

          <div class="hero-meta">

            <div class="hero-meta-item">
              <strong id="monthlyAverage">¥0</strong>
              月均支出
            </div>

            <div class="hero-meta-item">
              <strong id="activeMonths">0</strong>
              有消费月份
            </div>

            <div class="hero-meta-item">
              <strong id="annualCount">0</strong>
              笔消费
            </div>

          </div>

        </div>

        <div class="card ai-card">

          <div class="ai-heading">
            <div class="ai-title">AI 年度总结</div>
            <div class="ai-badge">AI Insight</div>
          </div>

          <div id="aiSummary" class="ai-content">
            正在整理你的年度消费情况……
          </div>

        </div>

      </div>

      <div class="overview-grid">

        <!-- 支出结构 -->
        <div class="card overview-card">

          <div class="section-title">
            支出结构
          </div>

          <div class="structure-layout">

            <div class="donut-wrap">
              <canvas id="donutChart" width="165" height="165"></canvas>

              <div class="donut-center">
                <div class="donut-center-number" id="donutTotal">
                  ¥0
                </div>
                <div class="donut-center-label">
                  年度支出
                </div>
              </div>
            </div>

            <div id="categoryList" class="category-list"></div>

          </div>

        </div>

        <!-- 月度趋势 -->
        <div class="card overview-card">

          <div class="section-title">
            月度支出趋势
          </div>

          <div class="chart-wrap">
            <canvas id="trendChart"></canvas>
          </div>

        </div>

        <!-- 常去的店铺 -->
        <div class="card overview-card">

          <div class="section-title">
            常去的店铺
          </div>

          <div id="storeList" class="store-list"></div>

        </div>

        <!-- 空间给未来扩展 / 年度摘要 -->
        <div class="card overview-card">

          <div class="section-title">
            年度概览
          </div>

          <div id="annualOverviewText"
               style="color:#74777C;font-size:13px;line-height:1.8;">
          </div>

        </div>

      </div>

    </section>

    <!-- =========================
         Details
    ========================== -->

    <section id="detailsPage" style="display:none;">

      <div class="details-summary">

        <div class="summary-box">
          <div class="summary-label">筛选后支出</div>
          <div class="summary-value" id="detailsTotal">¥0</div>
        </div>

        <div class="summary-box">
          <div class="summary-label">记录数</div>
          <div class="summary-value" id="detailsCount">0</div>
        </div>

      </div>

      <div class="card filters">

        <!-- 花销明细自己的年份 Filter -->
        <select id="detailsYear"
                class="filter-select"
                onchange="renderDetails()">
        </select>

        <select id="detailsMonth"
                class="filter-select"
                onchange="renderDetails()">
          <option value="all">全部月份</option>
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>

        <select id="detailsCategory"
                class="filter-select"
                onchange="renderDetails()">
          <option value="all">全部大项目</option>
        </select>

        <input
          id="detailsSearch"
          class="search-input"
          placeholder="搜索店铺 / 内容"
          oninput="renderDetails()"
        >

      </div>

      <div id="detailsList"></div>

    </section>

  </main>
</div>

<!-- Mobile Navigation -->

<div class="mobile-nav">

  <button id="mobileOverview"
          class="active"
          onclick="showPage('overview')">
    全年纵览
  </button>

  <button id="mobileDetails"
          onclick="showPage('details')">
    花销明细
  </button>

  <button onclick="openAddModal()">
    ＋ 添加
  </button>

</div>


<!-- =========================
     Add / Edit Modal
========================== -->

<div id="modalBackdrop" class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title" id="modalTitle">
        添加花销
      </div>

      <button class="close-btn" onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">日期</label>
        <input
          id="formDate"
          class="form-input"
          type="datetime-local">
      </div>

      <div class="form-group">
        <label class="form-label">店铺</label>
        <input
          id="formStore"
          class="form-input"
          type="text">
      </div>

      <div class="form-group">
        <label class="form-label">金额</label>
        <input
          id="formAmount"
          class="form-input"
          type="number"
          step="0.01">
      </div>

      <div class="form-group">
        <label class="form-label">支付方法</label>

        <select
          id="formPayment"
          class="form-select">
          <option value="">请选择</option>
        </select>

      </div>

      <div class="form-group">
        <label class="form-label">大项目</label>

        <select
          id="formLarge"
          class="form-select">
          <option value="">请选择</option>
        </select>

      </div>

      <div class="form-group">
        <label class="form-label">中项目</label>

        <select
          id="formMiddle"
          class="form-select">
          <option value="">请选择</option>
        </select>

      </div>

      <div class="form-group full">
        <label class="form-label">内容</label>

        <textarea
          id="formContent"
          class="form-textarea">
        </textarea>

      </div>

    </div>

    <div class="modal-actions">

      <button
        id="deleteButton"
        class="delete-btn"
        onclick="deleteCurrentExpense()"
        style="display:none;">
        删除这笔记录
      </button>

      <div class="modal-actions-right">

        <button
          class="cancel-btn"
          onclick="closeModal()">
          取消
        </button>

        <button
          class="save-btn"
          onclick="saveCurrentExpense()">
          保存
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxb--pgAmPuBxtOUt2N7PTsU4C5D8-i7DhvXbcmL69OLRCNHiTDPyjU7ZmuV5loMZwfYA/exec';


/* =========================================================
   GLOBAL DATA
========================================================= */

let expenses = [];

/*
 * Settings 只在页面打开时读取一次。
 *
 * 后续新增 / 编辑 / Filter 都使用这一份 settings。
 */
let settings = {
  paymentMethods: [],

  rules: []
};

/* =========================================================
   INIT
========================================================= */

document.addEventListener('DOMContentLoaded', async () => {

  try {

    await loadAllData();

    initializeYearFilters();

    renderAll();

  } catch (error) {

    console.error(error);

    alert(
      '读取数据失败。\n\n' +
      '请确认 Apps Script Web App 是否正常部署。\n\n' +
      error.message
    );

  }

});


/* =========================================================
   LOAD DATA
========================================================= */

async function loadAllData() {

  /*
   * 只在页面打开的时候请求一次。
   *
   * action=all
   * → expenses
   * → settings
   */

  const response = await fetch(
    API_URL + '?action=all',
    {
      method: 'GET',
      cache: 'no-store'
    }
  );

  if (!response.ok) {
    throw new Error(
      'Apps Script HTTP Error: ' + response.status
    );
  }

  const data = await response.json();

  if (data.success === false) {
    throw new Error(
      data.error || 'Apps Script 返回失败'
    );
  }

  /*
   * Expenses
   */

  expenses =
    Array.isArray(data.expenses)
      ? data.expenses
      : [];


  /*
   * Settings
   *
   * 兼容 Apps Script 不同返回结构。
   */

  settings =
    normalizeSettings(
      data.settings ||
      data.setting ||
      data.config ||
      data
    );


  console.log('Expenses:', expenses);
  console.log('Settings:', settings);


  /*
   * 如果 Settings 没有读到任何东西，
   * 直接提示，而不是让下拉框静默变成空白。
   */

  if (
    settings.paymentMethods.length === 0 &&
    settings.largeCategories.length === 0 &&
    settings.middleCategories.length === 0
  ) {

    console.warn(
      '没有从 Apps Script 读取到設定数据。'
    );

  }

}


/* =========================================================
   SETTINGS NORMALIZER
========================================================= */

function normalizeSettings(raw) {

  let result = {
    paymentMethods: [],
    largeCategories: [],
    middleCategories: [],
    rules: []
  };


  /*
   * 情况 1：
   *
   * {
   *   paymentMethods: [],
   *   largeCategories: [],
   *   middleCategories: [],
   *   rules: []
   * }
   */

  if (raw && typeof raw === 'object') {

    result.paymentMethods =
      firstArray(
        raw.paymentMethods,
        raw.payments,
        raw.payment,
        raw.支払方法
      );

    result.largeCategories =
      firstArray(
        raw.largeCategories,
        raw.categories,
        raw.large,
        raw.大項目
      );

    result.middleCategories =
      firstArray(
        raw.middleCategories,
        raw.subcategories,
        raw.middle,
        raw.中項目
      );

    result.rules =
      firstArray(
        raw.rules,
        raw.規則
      );

  }


  /*
   * 情况 2：
   *
   * Apps Script 返回：
   *
   * settings: [
   *   {
   *     paymentMethod: ...,
   *     largeCategory: ...,
   *     middleCategory: ...,
   *     rule: ...
   *   }
   * ]
   */

  const rows =
    Array.isArray(raw)
      ? raw
      : (
          Array.isArray(raw?.rows)
            ? raw.rows
            : null
        );

  if (rows) {

    const payments = [];
    const larges = [];
    const middles = [];
    const rules = [];

    rows.forEach(row => {

      if (Array.isArray(row)) {

        const payment = row[0];
        const large = row[1];
        const middle = row[2];
        const rule = row[3];

        if (payment) payments.push(String(payment));
        if (large) larges.push(String(large));

        if (large && middle) {

          middles.push({
            large: String(large),
            middle: String(middle)
          });

        }

        if (rule) {

          rules.push({
            payment: payment
              ? String(payment)
              : '',
            large: large
              ? String(large)
              : '',
            middle: middle
              ? String(middle)
              : '',
            rule: String(rule)
          });

        }

      } else if (
        row &&
        typeof row === 'object'
      ) {

        const payment =
          row.paymentMethod ??
          row.payment ??
          row['支払方法'];

        const large =
          row.largeCategory ??
          row.large ??
          row['大項目'];

        const middle =
          row.middleCategory ??
          row.middle ??
          row['中項目'];

        const rule =
          row.rule ??
          row['規則'];

        if (payment) payments.push(String(payment));
        if (large) larges.push(String(large));

        if (large && middle) {

          middles.push({
            large: String(large),
            middle: String(middle)
          });

        }

        if (rule) {

          rules.push({
            payment: payment
              ? String(payment)
              : '',
            large: large
              ? String(large)
              : '',
            middle: middle
              ? String(middle)
              : '',
            rule: String(rule)
          });

        }

      }

    });

    if (result.paymentMethods.length === 0) {
      result.paymentMethods = payments;
    }

    if (result.largeCategories.length === 0) {
      result.largeCategories = larges;
    }

    if (result.middleCategories.length === 0) {
      result.middleCategories = middles;
    }

    if (result.rules.length === 0) {
      result.rules = rules;
    }

  }


  /*
   * 去重
   */

  result.paymentMethods =
    uniqueStrings(result.paymentMethods);

  result.largeCategories =
    uniqueStrings(result.largeCategories);


  /*
   * 中项目既可能是：
   *
   * ["食料品", "外食(ご飯)"]
   *
   * 也可能是：
   *
   * [
   *   {large:"食費",middle:"食料品"}
   * ]
   */

  if (
    result.middleCategories.length &&
    typeof result.middleCategories[0] === 'string'
  ) {

    result.middleCategories =
      uniqueStrings(
        result.middleCategories
      );

  } else {

    const unique = [];

    result.middleCategories.forEach(item => {

      if (!item) return;

      const large =
        item.large ??
        item.largeCategory ??
        item['大項目'] ??
        '';

      const middle =
        item.middle ??
        item.middleCategory ??
        item['中項目'] ??
        '';

      if (!middle) return;

      const exists =
        unique.some(
          x =>
            x.large === String(large) &&
            x.middle === String(middle)
        );

      if (!exists) {

        unique.push({
          large: String(large),
          middle: String(middle)
        });

      }

    });

    result.middleCategories = unique;

  }

  return result;

}


function firstArray(...values) {

  for (const value of values) {

    if (Array.isArray(value)) {
      return [...value];
    }

  }

  return [];

}


function uniqueStrings(arr) {

  const output = [];

  arr.forEach(value => {

    if (value === null || value === undefined) {
      return;
    }

    const text = String(value).trim();

    if (!text) return;

    if (!output.includes(text)) {
      output.push(text);
    }

  });

  return output;

}


/* =========================================================
   YEAR FILTERS
========================================================= */

function initializeYearFilters() {

  const years = getAvailableYears();

  if (!years.includes(currentOverviewYear)) {

    currentOverviewYear =
      years.length
        ? Math.max(...years)
        : new Date().getFullYear();

  }

  const overview =
    document.getElementById('overviewYear');

  const details =
    document.getElementById('detailsYear');


  overview.innerHTML =
    years
      .map(
        year =>
          `<option value="${year}">
             ${year}年
           </option>`
      )
      .join('');

  details.innerHTML =
    years
      .map(
        year =>
          `<option value="${year}">
             ${year}年
           </option>`
      )
      .join('');


  overview.value =
    String(currentOverviewYear);


  /*
   * 花销明细默认今年。
   */

  const currentYear =
    new Date().getFullYear();

  if (years.includes(currentYear)) {

    details.value =
      String(currentYear);

  } else if (years.length) {

    details.value =
      String(Math.max(...years));

  }

  initializeCategoryFilter();

}


function getAvailableYears() {

  const set = new Set();

  expenses.forEach(expense => {

    const date =
      parseExpenseDate(expense['日付']);

    if (date) {
      set.add(date.getFullYear());
    }

  });

  /*
   * 至少保留当前年份。
   */

  set.add(new Date().getFullYear());

  return Array.from(set).sort(
    (a,b) => b-a
  );

}


function changeOverviewYear() {

  currentOverviewYear =
    Number(
      document.getElementById('overviewYear').value
    );

  renderOverview();

}


/* =========================================================
   CATEGORY FILTER
========================================================= */

function initializeCategoryFilter() {

  const select =
    document.getElementById('detailsCategory');

  select.innerHTML =
    '<option value="all">全部大项目</option>';


  settings.largeCategories.forEach(category => {

    const option =
      document.createElement('option');

    option.value = category;
    option.textContent = category;

    select.appendChild(option);

  });

}


/* =========================================================

========================================================= */

function showPage(page) {

  currentPage = page;

  const overview =
    document.getElementById('overviewPage');

  const details =
    document.getElementById('detailsPage');

  const title =
    document.getElementById('pageTitle');

  const subtitle =
    document.getElementById('pageSubtitle');

  const overviewNav =
    document.getElementById('navOverview');

  const detailsNav =
    document.getElementById('navDetails');

  const mobileOverview =
    document.getElementById('mobileOverview');

  const mobileDetails =
    document.getElementById('mobileDetails');


  if (page === 'overview') {

    overview.style.display = '';
    details.style.display = 'none';

    title.textContent = '全年纵览';
    subtitle.textContent =
      '看见你的钱都花在哪里';

    overviewNav.classList.add('active');
    detailsNav.classList.remove('active');

    mobileOverview.classList.add('active');
    mobileDetails.classList.remove('active');

    renderOverview();

  } else {

    overview.style.display = 'none';
    details.style.display = '';

    title.textContent = '花销明细';
    subtitle.textContent =
      '查看、编辑和管理每一笔花销';

    overviewNav.classList.remove('active');
    detailsNav.classList.add('active');

    mobileOverview.classList.remove('active');
    mobileDetails.classList.add('active');

    renderDetails();

  }

}

/* =========================================================
   OVERVIEW
========================================================= */

function renderOverview() {

  const year =
    currentOverviewYear;

  const yearExpenses =
    expenses.filter(expense => {

      const date =
        parseExpenseDate(expense['日付']);

      return date &&
             date.getFullYear() === year;

    });


  /*
   * 年度统计：
   * 只计算 計算対象 = 1
   *
   * 这个值由 Apps Script 根据設定 Sheet D列规则计算。
   */

  const calculated =
    yearExpenses.filter(
      expense =>
        Number(expense['計算対象']) === 1
    );


  const total =
    calculated.reduce(
      (sum, expense) =>
        sum + toNumber(expense['金額']),
      0
    );


  const activeMonths =
    new Set(
      calculated
        .map(
          expense =>
            parseExpenseDate(expense['日付'])
        )
        .filter(Boolean)
        .map(
          date => date.getMonth() + 1
        )
    ).size;


  document.getElementById(
    'annualTotal'
  ).innerHTML =
    formatYen(total);


  document.getElementById(
    'monthlyAverage'
  ).textContent =
    formatYen(
      activeMonths
        ? total / activeMonths
        : 0
    );


  document.getElementById(
    'activeMonths'
  ).textContent =
    activeMonths;


  document.getElementById(
    'annualCount'
  ).textContent =
    calculated.length;


  document.getElementById(
    'donutTotal'
  ).textContent =
    formatYen(total);


  renderCategoryStructure(
    calculated,
    total
  );


  renderTrendChart();


  renderFrequentStores(
    calculated
  );


  renderAISummary(
    calculated,
    total,
    year
  );


  renderAnnualOverviewText(
    calculated,
    total,
    year
  );

}


/* =========================================================
   CATEGORY STRUCTURE
========================================================= */

function renderCategoryStructure(
  data,
  total
) {

  const container =
    document.getElementById('categoryList');

  const categories = {};


  data.forEach(expense => {

    const category =
      expense['大項目'] ||
      'その他';

    categories[category] =
      (categories[category] || 0) +
      toNumber(expense['金額']);

  });


  const sorted =
    Object.entries(categories)
      .sort(
        (a,b) => b[1] - a[1]
      );


  /*
   * 图表
   */

  drawDonutChart(
    sorted.map(x => x[1])
  );


  /*
   * 文字列表
   *
   * 金额 + 百分比
   */

  const dotColors = [
    '#E98B5C',
    '#F4C95D',
    '#8FAFC0',
    '#E98278',
    '#9B8FBD',
    '#83B692',
    '#D49B76',
    '#A5A5A5',
    '#6F8F9F',
    '#C9A0A0'
  ];


  container.innerHTML =
    sorted.length
      ? sorted
          .map(
            ([name, amount], index) => {

              const percent =
                total
                  ? amount / total * 100
                  : 0;

              return `
                <div class="category-row">

                  <div
                    class="category-dot"
                    style="
                      background:${dotColors[index % dotColors.length]}
                    ">
                  </div>

                  <div class="category-name">
                    ${escapeHtml(name)}
                  </div>

                  <div class="category-value">

                    ${formatYen(amount)}

                    <span class="category-percent">
                      ${percent.toFixed(1)}%
                    </span>

                  </div>

                </div>
              `;

            }
          )
          .join('')
      : `
          <div class="muted">
            暂无数据
          </div>
        `;

}


/* =========================================================
   DONUT
========================================================= */

function drawDonutChart(values) {

  const canvas =
    document.getElementById('donutChart');

  const ctx =
    canvas.getContext('2d');

  const width =
    canvas.width;

  const height =
    canvas.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const total =
    values.reduce(
      (a,b) => a+b,
      0
    );


  if (!total) {

    ctx.beginPath();

    ctx.arc(
      width/2,
      height/2,
      62,
      0,
      Math.PI * 2
    );

    ctx.lineWidth = 20;
    ctx.strokeStyle = '#ECEAE5';
    ctx.stroke();

    return;

  }


  const colors = [
    '#E98B5C',
    '#F4C95D',
    '#8FAFC0',
    '#E98278',
    '#9B8FBD',
    '#83B692',
    '#D49B76',
    '#A5A5A5',
    '#6F8F9F',
    '#C9A0A0'
  ];


  let start =
    -Math.PI / 2;


  values.forEach(
    (value, index) => {

      const angle =
        value / total *
        Math.PI * 2;

      ctx.beginPath();

      ctx.arc(
        width/2,
        height/2,
        62,
        start,
        start + angle
      );

      ctx.lineWidth = 20;

      ctx.strokeStyle =
        colors[index % colors.length];

      ctx.stroke();

      start += angle;

    }
  );

}


/* =========================================================
   MONTHLY TREND
   同一张图显示多个年份
========================================================= */

function renderTrendChart() {

  const canvas =
    document.getElementById('trendChart');

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    rect.width || 500;

  const height =
    rect.height || 250;

  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;

  const ctx =
    canvas.getContext('2d');

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
   * 找到所有年份
   */

  const years =
    getAvailableYears()
      .sort((a,b) => a-b);


  const series = {};


  years.forEach(year => {

    series[year] =
      Array(12).fill(0);

  });


  expenses.forEach(expense => {

    if (
      Number(expense['計算対象']) !== 1
    ) {
      return;
    }

    const date =
      parseExpenseDate(
        expense['日付']
      );

    if (!date) return;

    const year =
      date.getFullYear();

    if (!series[year]) {
      series[year] =
        Array(12).fill(0);
    }

    series[year][
      date.getMonth()
    ] +=
      toNumber(expense['金額']);

  });


  const padding = {
    left: 48,
    right: 20,
    top: 24,
    bottom: 35
  };


  const chartW =
    width -
    padding.left -
    padding.right;

  const chartH =
    height -
    padding.top -
    padding.bottom;


  const allValues =
    Object.values(series)
      .flat();


  const maxValue =
    Math.max(
      ...allValues,
      100
    );


  const roundedMax =
    niceMax(maxValue);


  /*
   * 网格
   */

  ctx.font =
    '11px -apple-system, BlinkMacSystemFont, sans-serif';

  ctx.textAlign = 'right';

  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#8A8D92';

  for (let i=0; i<=4; i++) {

    const ratio =
      i / 4;

    const y =
      padding.top +
      chartH -
      ratio * chartH;

    const value =
      roundedMax * ratio;

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      y
    );

    ctx.lineTo(
      width - padding.right,
      y
    );

    ctx.strokeStyle = '#F0EEEA';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillText(
      formatCompactYen(value),
      padding.left - 8,
      y
    );

  }


  /*
   * X labels
   */

  ctx.textAlign = 'center';

  ctx.textBaseline = 'top';

  for (let month=0; month<12; month++) {

    const x =
      padding.left +
      month / 11 * chartW;

    ctx.fillStyle = '#8A8D92';

    ctx.fillText(
      `${month+1}月`,
      x,
      height - padding.bottom + 10
    );

  }


  /*
   * 不同年份用不同线型 / 色调。
   */

  const lineColors = [
    '#E98B5C',
    '#8FAFC0',
    '#9B8FBD',
    '#83B692',
    '#E98278',
    '#D49B76'
  ];


  years.forEach(
    (year, yearIndex) => {

      const values =
        series[year];

      const color =
        lineColors[
          yearIndex % lineColors.length
        ];


      ctx.beginPath();

      values.forEach(
        (value, month) => {

          const x =
            padding.left +
            month / 11 * chartW;

          const y =
            padding.top +
            chartH -
            value / roundedMax *
            chartH;

          if (month === 0) {
            ctx.moveTo(x,y);
          } else {
            ctx.lineTo(x,y);
          }

        }
      );


      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();


      /*
       * 数据点
       */

      values.forEach(
        (value, month) => {

          const x =
            padding.left +
            month / 11 * chartW;

          const y =
            padding.top +
            chartH -
            value / roundedMax *
            chartH;

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            3,
            0,
            Math.PI * 2
          );

          ctx.fillStyle = color;
          ctx.fill();

        }
      );

    }
  );


  /*
   * Legend
   */

  let legendX = padding.left;

  const legendY = 7;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  years.forEach(
    (year, index) => {

      const color =
        lineColors[
          index % lineColors.length
        ];

      ctx.beginPath();

      ctx.arc(
        legendX,
        legendY,
        4,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = color;
      ctx.fill();

      ctx.fillStyle = '#686B70';

      ctx.fillText(
        String(year),
        legendX + 8,
        legendY
      );

      legendX +=
        42 + String(year).length * 6;

    }
  );

}


function niceMax(value) {

  if (value <= 1000) {
    return Math.ceil(value / 200) * 200;
  }

  if (value <= 10000) {
    return Math.ceil(value / 2000) * 2000;
  }

  if (value <= 100000) {
    return Math.ceil(value / 20000) * 20000;
  }

  if (value <= 1000000) {
    return Math.ceil(value / 200000) * 200000;
  }

  return Math.ceil(value / 1000000) * 1000000;

}


function formatCompactYen(value) {

  if (value >= 1000000) {
    return '¥' +
      (value / 1000000).toFixed(1) +
      'M';
  }

  if (value >= 1000) {
    return '¥' +
      (value / 1000).toFixed(0) +
      'k';
  }

  return '¥' +
    Math.round(value);

}


/* =========================================================
   FREQUENT STORES
========================================================= */

function renderFrequentStores(data) {

  const container =
    document.getElementById('storeList');

  const stores = {};


  data.forEach(expense => {

    const store =
      String(
        expense['店舗'] || '未填写'
      ).trim();

    if (!stores[store]) {

      stores[store] = {
        count: 0,
        total: 0
      };

    }

    stores[store].count += 1;

    stores[store].total +=
      toNumber(expense['金額']);

  });


  const sorted =
    Object.entries(stores)
      .sort(
        (a,b) =>
          b[1].count - a[1].count ||
          b[1].total - a[1].total
      )
      .slice(0, 6);


  if (!sorted.length) {

    container.innerHTML =
      '<div class="empty">暂无数据</div>';

    return;

  }


  container.innerHTML =
    sorted
      .map(
        ([store, info]) => `
          <div class="store-row">

            <div class="store-name">
              ${escapeHtml(store)}
            </div>

            <div class="store-count">
              ${info.count}
              <span>次</span>
            </div>

            <div class="store-total">
              ${formatYen(info.total)}
            </div>

          </div>
        `
      )
      .join('');

}


/* =========================================================
   AI SUMMARY
========================================================= */

function renderAISummary(
  data,
  total,
  year
) {

  const container =
    document.getElementById('aiSummary');

  if (!data.length) {

    container.innerHTML =
      `${year}年目前还没有可统计的消费记录。`;

    return;

  }


  const categoryMap = {};

  data.forEach(expense => {

    const category =
      expense['大項目'] || '其他';

    categoryMap[category] =
      (categoryMap[category] || 0) +
      toNumber(expense['金額']);

  });


  const topCategory =
    Object.entries(categoryMap)
      .sort(
        (a,b) => b[1] - a[1]
      )[0];


  const monthly = Array(12).fill(0);

  data.forEach(expense => {

    const date =
      parseExpenseDate(
        expense['日付']
      );

    if (!date) return;

    monthly[
      date.getMonth()
    ] += toNumber(expense['金額']);

  });


  const maxMonthIndex =
    monthly.indexOf(
      Math.max(...monthly)
    );


  const average =
    total / data.length;


  container.innerHTML = `
    <div>
      ${year}年共有
      <strong>${data.length}</strong>
      笔计入年度统计的消费，
      总支出约
      <strong>${formatYen(total)}</strong>。
    </div>

    <div style="margin-top:7px;">
      支出最多的大项目是
      <strong>${escapeHtml(topCategory?.[0] || '暂无')}</strong>，
      共
      <strong>${formatYen(topCategory?.[1] || 0)}</strong>。
    </div>

    <div style="margin-top:7px;">
      单笔平均消费约
      <strong>${formatYen(average)}</strong>，
      ${maxMonthIndex >= 0
        ? `其中 ${maxMonthIndex + 1}月支出最高。`
        : ''}
    </div>

    <div style="
      margin-top:10px;
      color:#8A8D92;
      font-size:11px;">
      以上为基于当前账目自动生成的年度概览。
    </div>
  `;

}


/* =========================================================
   ANNUAL OVERVIEW TEXT
========================================================= */

function renderAnnualOverviewText(
  data,
  total,
  year
) {

  const container =
    document.getElementById(
      'annualOverviewText'
    );

  if (!data.length) {

    container.textContent =
      `${year}年还没有可统计的消费记录。`;

    Array(12).fill(0);

      );

/* =========================================================
   DETAILS
========================================================= */

function renderDetails() {

  const year =
    Number(
      document.getElementById(
        'detailsYear'
      ).value
    );


  const month =
    document.getElementById(
      'detailsMonth'
    ).value;


  const category =
    document.getElementById(
      'detailsCategory'
    ).value;


  const search =
    document.getElementById(
      'detailsSearch'
    ).value
      .trim()
      .toLowerCase();


  let data =
    expenses.filter(expense => {

      const date =
        parseExpenseDate(
          expense['日付']
        );

      if (!date) return false;

      if (
        year &&
        date.getFullYear() !== year
      ) {
        return false;
      }

      if (
        month !== 'all' &&
        date.getMonth() + 1 !== Number(month)
      ) {
        return false;
      }

      if (
        category !== 'all' &&
        expense['大項目'] !== category
      ) {
        return false;
      }

      if (search) {

        const store =
          String(
            expense['店舗'] || ''
          ).toLowerCase();

        const content =
          String(
            expense['内容'] || ''
          ).toLowerCase();

        if (
          !store.includes(search) &&
          !content.includes(search)
        ) {
          return false;
        }

      }

      return true;

    });


  data.sort(
    (a,b) =>
      parseExpenseDate(b['日付']) -
      parseExpenseDate(a['日付'])
  );


  const total =
    data.reduce(
      (sum, expense) =>
        sum + toNumber(expense['金額']),
      0
    );


  document.getElementById(
    'detailsTotal'
  ).textContent =
    formatYen(total);


  document.getElementById(
    'detailsCount'
  ).textContent =
    data.length;


  renderExpenseList(data);

}


/* =========================================================
   EXPENSE LIST
========================================================= */

function renderExpenseList(data) {

  const container =
    document.getElementById(
      'detailsList'
    );


  if (!data.length) {

    container.innerHTML =
      `
        <div class="card empty">
          没有符合条件的记录
        </div>
      `;

    return;

  }


  const groups = {};


  data.forEach(expense => {

    const date =
      parseExpenseDate(
        expense['日付']
      );

    if (!date) return;

    const key =
      dateKey(date);

    if (!groups[key]) {
      groups[key] = [];
    }

    groups[key].push(expense);

  });


  container.innerHTML =
    Object.entries(groups)
      .map(
        ([date, records]) => {

          return `
            <div class="expense-group">

              <div class="expense-date">
                ${formatDateTitle(date)}
              </div>

              ${records
                .map(
                  expense =>
                    renderExpenseItem(expense)
                )
                .join('')}

            </div>
          `;

        }
      )
      .join('');

}


function renderExpenseItem(expense) {

  return `
    <div class="expense-item">

      <div class="expense-main">

        <div class="expense-store">
          ${escapeHtml(
            expense['店舗'] || '未填写'
          )}
        </div>

        <div class="expense-content">
          ${escapeHtml(
            expense['内容'] || ''
          )}
        </div>

      </div>

      <div class="expense-category">

        ${escapeHtml(
          expense['大項目'] || ''
        )}

        /
        
        ${escapeHtml(
          expense['中項目'] || ''
        )}

      </div>

      <div style="
        display:flex;
        align-items:center;
        gap:12px;">

        <div class="expense-amount">
          ${formatYen(
            toNumber(expense['金額'])
          )}
        </div>

        <button
          class="edit-btn"
          onclick='openEditModal(${JSON.stringify(
            expense
          )})'>
          编辑
        </button>

      </div>

    </div>
  `;

}

/* =========================================================
   DYNAMIC SETTINGS SELECTS
========================================================= */

function populatePaymentSelect() {

  const select =
    document.getElementById(
      'formPayment'
    );


  select.innerHTML =
    '<option value="">请选择</option>';


  settings.paymentMethods.forEach(
    payment => {

      const option =
        document.createElement('option');

      option.value = payment;
      option.textContent = payment;

      select.appendChild(option);

    }
  );

}


function populateLargeSelect() {

  const select =
    document.getElementById(
      'formLarge'
    );


  select.innerHTML =
    '<option value="">请选择</option>';


  settings.largeCategories.forEach(
    category => {

      const option =
        document.createElement('option');

      option.value = category;
      option.textContent = category;

      select.appendChild(option);

    }
  );


  /*
   * 大项目改变时，
   * 自动重新生成中项目。
   */

  select.onchange =
    function() {

      populateMiddleSelect(
        this.value
      );

    };

}


function populateMiddleSelect(
  largeCategory
) {

  const select =
    document.getElementById(
      'formMiddle'
    );


  select.innerHTML =
    '<option value="">请选择</option>';


  let middles = [];


  /*
   * 如果中项目包含所属大项目，
   * 直接按照关系过滤。
   */

  if (
    settings.middleCategories.length &&
    typeof settings.middleCategories[0] === 'object'
  ) {

    middles =
      settings.middleCategories
        .filter(
          item =>
            item.large === largeCategory
        )
        .map(
          item => item.middle
        );

  } else {

    /*
     * 如果 Apps Script 返回的中项目只是字符串，
     * 就全部显示。
     *
     * 但按照我们现在的 Apps Script 设定结构，
     * 正常应该能获得大项目→中项目关系。
     */

    middles =
      settings.middleCategories;

  }


  uniqueStrings(middles)
    .forEach(
      middle => {

        const option =
          document.createElement('option');

        option.value = middle;
        option.textContent = middle;

        select.appendChild(option);

      }
    );

}

/* =========================================================
   SAVE
========================================================= */

async function saveCurrentExpense() {

  const date =
    document.getElementById(
      'formDate'
    ).value;


  const store =
    document.getElementById(
      'formStore'
    ).value.trim();


  const amount =
    Number(
      document.getElementById(
        'formAmount'
      ).value
    );


  const payment =
    document.getElementById(
      'formPayment'
    ).value;


  const large =
    document.getElementById(
      'formLarge'
    ).value;


  const middle =
    document.getElementById(
      'formMiddle'
    ).value;


  const content =
    document.getElementById(
      'formContent'
    ).value.trim();


  if (!date) {

    alert('请选择日期。');
    return;

  }

  if (!store) {

    alert('请填写店铺。');
    return;

  }

  if (
    !Number.isFinite(amount) ||
    amount < 0
  ) {

    alert('请输入正确的金额。');
    return;

  }

  if (!payment) {

    alert('请选择支付方法。');
    return;

  }

  if (!large) {

    alert('请选择大项目。');
    return;

  }

  if (!middle) {

    alert('请选择中项目。');
    return;

  }


  /*
   * 注意：
   *
   * 这里故意不发送 計算対象。
   *
   * Apps Script 会根据「設定」Sheet D列规则
   * 自动计算。
   */

  const payload = {

    date: date,
    store: store,
    amount: amount,
    paymentMethod: payment,
    largeCategory: large,
    middleCategory: middle,
    content: content

  };


  try {

    if (editingRowNumber) {

      payload.action = 'update';

      payload.rowNumber =
        editingRowNumber;

    } else {

      payload.action = 'add';

    }


    const response =
      await postData(payload);


    if (!response.success) {

      throw new Error(
        response.error ||
        '保存失败'
      );

    }


    /*
     * 保存成功后，
     * 重新读取 expense 数据会违反
     * “页面打开时读取一次”的设定。
     *
     * 因此这里直接根据服务器返回结果
     * 更新本地数据。
     */

    if (payload.action === 'add') {

      if (response.expense) {

        expenses.push(
          response.expense
        );

      } else {

        /*
         * 如果 Apps Script 只返回 success，
         * 为保证当前页面立即看到新记录，
         * 直接构造本地记录。
         */

        expenses.push({
          rowNumber:
            response.rowNumber || null,

          '日付': date,
          '店舗': store,
          '金額': amount,
          '支払方法': payment,
          '大項目': large,
          '中項目': middle,
          '内容': content,

          /*
           * 本地暂时使用规则推断。
           * 如果 Apps Script 返回了计算结果，
           * 优先使用服务器结果。
           */

          '計算対象':
            response['計算対象'] ??
            response.calculationTarget ??
            inferCalculationTarget(payment)

        });

      }

    } else {

      const index =
        expenses.findIndex(
          expense =>
            Number(expense.rowNumber) ===
            Number(editingRowNumber)
        );


      if (index >= 0) {

        expenses[index] = {

          ...expenses[index],

          '日付': date,
          '店舗': store,
          '金額': amount,
          '支払方法': payment,
          '大項目': large,
          '中項目': middle,
          '内容': content

        };


        if (
          response['計算対象'] !== undefined
        ) {

          expenses[index]['計算対象'] =
            response['計算対象'];

        }

      }

    }


    closeModal();

    initializeYearFilters();

    initializeCategoryFilter();

    renderAll();

  } catch (error) {

    console.error(error);

    alert(
      '保存失败：\n' +
      error.message
    );

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteCurrentExpense() {

  if (!editingRowNumber) {
    return;
  }


  const confirmed =
    confirm(
      '确定要删除这笔花销吗？'
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await postData({
        action: 'delete',
        rowNumber:
          editingRowNumber
      });


    if (!response.success) {

      throw new Error(
        response.error ||
        '删除失败'
      );

    }


    expenses =
      expenses.filter(
        expense =>
          Number(expense.rowNumber) !==
          Number(editingRowNumber)
      );


    closeModal();

    initializeYearFilters();

    initializeCategoryFilter();

    renderAll();

  } catch (error) {

    console.error(error);

    alert(
      '删除失败：\n' +
      error.message
    );

  }

}


/* =========================================================
   POST
========================================================= */

async function postData(payload) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body:
          JSON.stringify(payload)
      }
    );


  if (!response.ok) {

    throw new Error(
      'HTTP Error: ' +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   DATE
========================================================= */

function parseExpenseDate(value) {

  if (!value) return null;


  if (
    value instanceof Date
  ) {
    return value;
  }


  const text =
    String(value);


  /*
   * Google Apps Script 常见：
   * 2026-08-30T17:34:00.000Z
   */

  let date =
    new Date(text);


  if (!isNaN(date.getTime())) {
    return date;
  }


  /*
   * yyyy/mm/dd hh:mm
   */

  const match =
    text.match(
      /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/
    );


  if (match) {

    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      Number(match[4] || 0),
      Number(match[5] || 0)
    );

  }


  return null;

}


function toDatetimeLocal(date) {

  const local =
    new Date(
      date.getTime() -
      date.getTimezoneOffset() * 60000
    );

  return local
    .toISOString()
    .slice(0,16);

}


function dateKey(date) {

  return [
    date.getFullYear(),
    String(date.getMonth()+1)
      .padStart(2,'0'),
    String(date.getDate())
      .padStart(2,'0')
  ].join('-');

}


function formatDateTitle(key) {

  const [
    year,
    month,
    day
  ] =
    key.split('-');


  return `${year}年${Number(month)}月${Number(day)}日`;

}


/* =========================================================
   NUMBER / MONEY
========================================================= */

function toNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {
    return 0;
  }


  const number =
    Number(
      String(value)
        .replace(/,/g,'')
        .replace(/[¥￥]/g,'')
        .trim()
    );


  return Number.isFinite(number)
    ? number
    : 0;

}


function formatYen(value) {

  return '¥' +
    Math.round(
      toNumber(value)
    ).toLocaleString('ja-JP');

}


/*
 * 仅用于保存成功后本地立即更新。
 *
 * 真正的计算规则仍然以 Apps Script / 設定 Sheet D列为准。
 */

function inferCalculationTarget(payment) {

  /*
   * 这里只是为了在 Apps Script 只返回 success 时，
   * 让当前画面可以马上显示。
   *
   * 下一次打开页面时，
   * 一定以 Apps Script 保存后的真实值为准。
   */

  if (
    payment === 'Suica' ||
    payment === 'その他ポイント'
  ) {
    return 0;
  }

  return 1;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}
